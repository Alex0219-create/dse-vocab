<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>DSE Vocab V5.12.4</title>
<style>
/* =====================================================================
   DSE Vocab V5.0 — 全新設計系統
   ===================================================================== */
:root{
  --brand-1:#6366F1; --brand-2:#8B5CF6; --brand-3:#A855F7;
  --accent:#0EA5E9; --ok:#10B981; --warn:#F59E0B; --err:#EF4444;
  --bg:#F4F5FB; --bg-soft:#ECEFFA; --card:#FFFFFF; --card-2:#F8F9FF;
  --text:#171A2E; --sub:#667085; --faint:#98A2B3;
  --border:#E6E8F4; --border-2:#D8DCF0;
  --shadow-sm:0 2px 10px rgba(31,41,81,.06);
  --shadow-md:0 8px 28px rgba(31,41,81,.10);
  --shadow-lg:0 16px 48px rgba(31,41,81,.16);
  --grad:linear-gradient(135deg,var(--brand-1),var(--brand-2) 55%,var(--brand-3));
  --grad-soft:linear-gradient(135deg,#EEF1FF,#F5F0FF);
  --radius:20px; --radius-sm:14px; --radius-xs:10px;
  --nav-h:66px; --header-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
  /* V5.11.9 UK 讀音（音標 + UK 發音） */
  .exam-overlay{position:fixed;inset:0;z-index:9999;background:var(--card);display:flex;flex-direction:column;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .exam-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
  .exam-timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:19px;padding:5px 12px;border-radius:10px;background:var(--bg-soft);color:var(--brand-1);min-width:76px;text-align:center}
  .exam-timer.warn{color:#fff;background:#ef4444;animation:pulse 1s infinite}
  .exam-count{font-size:13px;font-weight:700;color:var(--sub)}
  .exam-area{flex:1;display:flex;flex-direction:column;padding:14px 14px 8px;min-height:0}
  .exam-topic{font-size:13px;color:var(--sub);line-height:1.5;background:var(--bg-soft);border-radius:10px;padding:9px 12px;margin-bottom:10px;flex-shrink:0}
  .exam-ta{flex:1;width:100%;border:1.5px solid var(--border);border-radius:14px;background:var(--bg);color:var(--txt);padding:14px;font-size:15px;line-height:1.9;resize:none;outline:none;font-family:inherit;min-height:0}
  .exam-ta:focus{border-color:var(--brand-1)}
  .exam-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;flex-shrink:0}
  .exam-progress{flex:1;height:8px;border-radius:6px;background:var(--bg-soft);overflow:hidden}
  .exam-progress .exam-fill{height:100%;border-radius:6px;background:var(--grad);transition:width .3s}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
}
html[data-theme="dark"]{
  --brand-1:#818CF8; --brand-2:#A78BFA; --brand-3:#C084FC;
  --accent:#38BDF8; --ok:#34D399; --warn:#FBBF24; --err:#F87171;
  --bg:#0E1017; --bg-soft:#151826; --card:#1A1E2C; --card-2:#202536;
  --text:#EDEFFA; --sub:#9AA3B8; --faint:#6B7280;
  --border:#2A2F42; --border-2:#363D55;
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 8px 28px rgba(0,0,0,.5);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#6366F1,#7C5CF5 55%,#A855F7);
  --grad-soft:linear-gradient(135deg,#1C2140,#241D3D);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;line-height:1.55;
  transition:background .3s,color .3s;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
textarea{resize:vertical}
::-webkit-scrollbar{width:0;height:0}
/* ===== 應用外殼 ===== */
.app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* ===== 頂欄 ===== */
.header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;z-index:30;flex-shrink:0}
.header h1{font-size:19px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.header .sub{font-size:11px;color:var(--faint);font-weight:600}
.hd-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:transform .15s,box-shadow .2s}
.icon-btn:active{transform:scale(.9)}
/* ===== 視圖容器 ===== */
.views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:6px 16px 20px;display:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.view.active{display:block;animation:viewIn .28s cubic-bezier(.22,.8,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
/* ===== 底部導航 ===== */
.nav{height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(31,41,81,.07);flex-shrink:0;position:relative;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);transition:color .2s;position:relative}
.nav button .ic{font-size:21px;line-height:1;transition:transform .2s}
.nav button.active{color:var(--brand-1)}
.nav button.active .ic{transform:translateY(-2px) scale(1.08)}
.nav button.active::before{content:"";position:absolute;top:-1px;width:26px;height:3.5px;border-radius:0 0 8px 8px;background:var(--grad)}
/* ===== 通用元件 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;transition:box-shadow .2s}
.card.tap{transition:transform .15s,box-shadow .2s}
.card.tap:active{transform:scale(.975)}
.section-title{font-size:14px;font-weight:800;color:var(--text);margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
.section-title .dot{width:5px;height:16px;border-radius:99px;background:var(--grad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--bg-soft);color:var(--sub);border:1px solid var(--border)}
.chip.brand{background:var(--grad);color:#fff;border:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:11px 18px;border-radius:var(--radius-sm);background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.32);transition:transform .15s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border-2);box-shadow:none}
.btn.soft{background:var(--grad-soft);color:var(--brand-1);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#F87171,#EF4444);box-shadow:0 6px 16px rgba(239,68,68,.3)}
.btn.sm{font-size:12px;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.5;pointer-events:none}
/* 輸入框 */
.field{background:var(--card);border:1.5px solid var(--border-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14.5px;color:var(--text);width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--brand-1);box-shadow:0 0 0 3.5px rgba(99,102,241,.14)}
textarea.field{min-height:150px;line-height:1.7}
/* 彈窗 */
.overlay{position:fixed;inset:0;background:rgba(15,17,30,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex;animation:ovIn .25s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:540px;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + var(--safe-b));max-height:86vh;overflow-y:auto;animation:sheetUp .3s cubic-bezier(.22,.9,.36,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:42px;height:4.5px;border-radius:99px;background:var(--border-2);margin:4px auto 14px}
/* Toast */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 20px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:88vw;text-align:center;box-shadow:var(--shadow-md)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 空狀態 */
.empty{padding:64px 24px;text-align:center;color:var(--sub);font-size:14px}
.empty .e-icon{font-size:44px;margin-bottom:12px}
/* ===== 首頁 ===== */
.hero{background:var(--grad);border-radius:24px;color:#fff;padding:22px 20px;margin:10px 0 14px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(99,102,241,.38)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{font-size:22px;font-weight:800;margin-bottom:3px;position:relative;z-index:1}
.hero p{opacity:.92;font-size:13px;position:relative;z-index:1}
.hero .goal-bar{background:rgba(255,255,255,.28);height:11px;border-radius:99px;margin-top:16px;overflow:hidden;position:relative;z-index:1}
.hero .goal-fill{height:100%;background:#fff;border-radius:99px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.hero .goal-txt{font-size:12px;margin-top:9px;opacity:.95;display:flex;justify-content:space-between;position:relative;z-index:1}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .num{font-size:23px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-card .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .qb{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px;align-items:flex-start;transition:transform .15s;position:relative;overflow:hidden}
.quick .qb:active{transform:scale(.96)}
.quick .qb .ic{font-size:26px}
.quick .qb .t{font-weight:800;font-size:13.5px}
.quick .qb .d{font-size:11px;color:var(--sub);line-height:1.4}
.quick .qb .badge{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--grad);color:#fff}
.wotd-card{background:var(--grad-soft);border:1px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.wotd-head{font-size:12.5px;font-weight:800;color:var(--brand-1);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.wotd-date{color:var(--faint);font-weight:600;font-size:11px}
.wotd-body{display:flex;flex-direction:column;gap:7px}
.dse-report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rp-cell{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 8px;text-align:center}
.rp-lv{font-size:13px;font-weight:800;color:#F59E0B;margin-bottom:4px}
.rp-num{font-size:21px;font-weight:800;color:var(--text);line-height:1.1}
.rp-lbl{font-size:10.5px;color:var(--faint);margin-top:2px}
.wt-detail-top{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px 15px;margin-bottom:12px}
.meta{font-size:12px;color:var(--sub)}
.wotd-phrase{font-size:20px;font-weight:800}
.wotd-stars{color:var(--warn);font-size:13px}
.wotd-mean{font-size:13.5px;color:var(--sub);margin-top:2px}
.wotd-ex{margin-top:6px;font-size:12px;color:var(--sub);background:rgba(99,102,241,.08);border-radius:10px;padding:7px 10px;line-height:1.5}
.mission-card{background:linear-gradient(135deg,#FFFBEB,#FDF2F8);border:1px solid #FDE68A;border-radius:20px;padding:15px 16px;margin-bottom:12px}
[data-theme=dark] .mission-card{background:linear-gradient(135deg,#332E1F,#331F2B);border-color:#55481F}
.mission-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px}
.mission-progress{font-size:12px;color:var(--sub);font-weight:600}
.mission-list{display:flex;flex-direction:column;gap:6px}
.mission-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);padding:5px 2px}
.mission-item .m-ic{width:22px;height:22px;border-radius:8px;background:var(--card);border:1.5px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px}
.mission-item.done{color:var(--faint);text-decoration:line-through}
.mission-item.done .m-ic{border-color:var(--ok);background:var(--ok);color:#fff}
/* DSE 進度卡 */
.dse-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.dse-card .dse-left{text-align:center;min-width:60px}
.dse-lv{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.dse-lbl{font-size:10px;color:var(--sub);margin-top:2px}
.dse-mid{flex:1}
.dse-count{font-size:13px;font-weight:700;margin-bottom:6px}
.dse-bar{height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin-bottom:4px}
.dse-fill{height:100%;border-radius:99px;transition:width .6s}
.dse-txt{font-size:10px;color:var(--faint)}
.dse-right{text-align:center;min-width:54px}
.dse-gap{font-size:18px;font-weight:800;color:var(--brand-1)}
/* ===== 閃卡 ===== */
.flash-wrap{display:flex;flex-direction:column;height:100%;padding-top:8px}
.flash-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.star-tog{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.star-tog input{accent-color:var(--brand-1);width:15px;height:15px}
.flash-card{flex:1;min-height:0;display:flex;flex-direction:column}
.fc-inner{flex:1;background:var(--card);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s}
.fc-inner::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.fc-inner.flipped{background:linear-gradient(160deg,var(--card),var(--grad-soft))}
.fc-cat{position:absolute;top:16px;left:16px;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;background:var(--bg-soft);color:var(--sub)}
.fc-phrase{font-size:27px;font-weight:800;text-align:center;line-height:1.35;margin-bottom:14px}
.fc-mean{font-size:16.5px;color:var(--sub);text-align:center;line-height:1.6}
.fc-ex{margin-top:12px;font-size:13px;color:var(--sub);background:rgba(99,102,241,.07);border-radius:12px;padding:9px 12px;line-height:1.6;max-width:92%;text-align:center}
.fc-hint{position:absolute;bottom:16px;font-size:11px;color:var(--faint)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-btn{padding:13px;border-radius:16px;font-size:14px;font-weight:800;text-align:center;transition:transform .15s;user-select:none}
.fc-btn:active{transform:scale(.95)}
.fc-btn.no{background:#FEF2F2;color:#EF4444;border:1.5px solid #FECACA}
.fc-btn.yes{background:#ECFDF5;color:#10B981;border:1.5px solid #A7F3D0}
[data-theme=dark] .fc-btn.no{background:#2A1A1E;color:#F87171;border-color:#4C2530}
[data-theme=dark] .fc-btn.yes{background:#122720;color:#34D399;border-color:#1F5A46}
.fc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub)}
.fc-empty .ic{font-size:48px}
/* ===== 測驗 ===== */
.quiz-progress{height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.quiz-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.quiz-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:12px}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.quiz-q{font-size:19px;font-weight:800;margin-bottom:16px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1.5px solid var(--border-2);border-radius:15px;padding:13px 14px;font-size:14px;transition:all .18s;text-align:left;line-height:1.45}
.quiz-opt .qk{width:26px;height:26px;border-radius:9px;background:var(--card);border:1.5px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub);flex-shrink:0}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{border-color:var(--ok);background:#ECFDF5}
.quiz-opt.wrong{border-color:var(--err);background:#FEF2F2}
.quiz-opt.correct .qk,.quiz-opt.wrong .qk{border-color:transparent;color:#fff}
.quiz-opt.correct .qk{background:var(--ok)}
.quiz-opt.wrong .qk{background:var(--err)}
[data-theme=dark] .quiz-opt.correct{background:#12281F}
[data-theme=dark] .quiz-opt.wrong{background:#2A1A1E}
.quiz-explain{margin-top:14px;font-size:13px;background:var(--grad-soft);border-radius:14px;padding:12px 14px;line-height:1.6;display:none}
.quiz-explain.show{display:block;animation:viewIn .25s}
/* 詞庫列表 */
.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s}
.list-item:active{transform:scale(.98)}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-ph{font-size:14.5px;font-weight:700}
.list-item .li-mean{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-stars{font-size:10px;color:var(--warn);letter-spacing:1px}
.list-item .li-fav{font-size:16px;color:var(--warn)}
.list-item.fav-hint{outline:2px solid var(--warn);outline-offset:2px}
.search-bar{display:flex;gap:8px;margin:10px 0 12px}
.search-bar .field{flex:1}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 15px;border-radius:99px;background:var(--card);border:1.5px solid var(--border-2);color:var(--sub);transition:all .2s}
.cat-chip.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
/* ===== 寫作 & 作文評分 ===== */
.wt-genre{margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--brand-1);letter-spacing:.4px}
.wt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wt-fmt{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px;cursor:pointer;transition:transform .15s;text-align:left;box-shadow:var(--shadow-sm)}
.wt-fmt:active{transform:scale(.96)}
.wt-fmt .t{font-size:13.5px;font-weight:800;color:var(--text)}
.wt-fmt .p{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.4}
.wt-group{margin-bottom:16px}
.wt-group h4{margin:0 0 9px;font-size:13px;color:var(--brand-1);display:flex;align-items:center;gap:6px}
.wt-phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.wt-phrase .txt{font-size:14px;font-weight:600;line-height:1.45}
.wt-phrase .mean{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4}
.wt-copy{flex-shrink:0;font-size:11px;padding:6px 11px;border:1.5px solid var(--border-2);border-radius:20px;background:transparent;color:var(--brand-1);cursor:pointer;transition:all .2s}
.wt-copy:hover{background:var(--brand-1);color:#fff}
.wt-copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* 作文評分 */
.essay-toolbar{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.essay-toolbar .btn{flex:1;min-width:110px}
.essay-prompt{font-size:13px;background:var(--grad-soft);border-radius:14px;padding:11px 14px;line-height:1.65;margin-bottom:12px;color:var(--text);border:1px solid var(--border)}
.essay-prompt .q-title{font-weight:800;color:var(--brand-1);margin-bottom:4px;font-size:13.5px}
.grade-result{animation:viewIn .3s}
.score-hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.score-hero::before{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.5}
.score-ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;z-index:1}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--bg-soft);stroke-width:9}
.score-ring .ring-fill{fill:none;stroke:url(#scoreGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}
.score-ring .ring-num{position:absolute;font-size:27px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score-ring .ring-den{position:absolute;margin-top:30px;font-size:11px;color:var(--faint);font-weight:700}
.score-info{z-index:1;flex:1}
.score-lv{font-size:24px;font-weight:800;margin-bottom:2px}
.score-lv .lv-tag{font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;margin-left:6px;vertical-align:2px}
.score-meta{font-size:12px;color:var(--sub);line-height:1.7}
.score-bars{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.dim-bar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.dim-bar .dim-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.dim-bar .dim-name{font-size:13px;font-weight:800}
.dim-bar .dim-score{font-size:13px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dim-bar .dim-track{height:9px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.dim-bar .dim-fill{height:100%;border-radius:99px;background:var(--grad);transition:width .8s cubic-bezier(.3,.8,.3,1)}
.dim-bar .dim-note{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.5}
.grade-section{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.grade-section h4{font-size:13.5px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.grade-section h4 .gs-ic{width:26px;height:26px;border-radius:9px;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;font-size:13px}
.grade-section ul{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.grade-section li{font-size:13px;color:var(--text);line-height:1.6;padding-left:20px;position:relative}
.grade-section li::before{content:"▸";position:absolute;left:4px;color:var(--brand-1);font-weight:800}
.grade-section li.good::before{content:"✓";color:var(--ok)}
.grade-section li.bad::before{content:"✕";color:var(--err)}
.grade-section .highlight{background:var(--grad-soft);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.7;color:var(--text)}
.grade-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:46px 0;color:var(--sub)}
.spinner{width:38px;height:38px;border-radius:50%;border:3.5px solid var(--bg-soft);border-top-color:var(--brand-1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 評分設置 */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .st-info .st-t{font-size:14px;font-weight:700}
.setting-row .st-info .st-d{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5}
/* 開關 */
.switch{width:48px;height:28px;border-radius:99px;background:var(--border-2);position:relative;transition:background .25s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.switch.on{background:var(--brand-1)}
.switch.on::after{transform:translateX(20px)}
/* ===== 統計 ===== */
.stats-hero{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center}
.stats-hero .sh-num{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats-hero .sh-lbl{font-size:11px;color:var(--sub);margin-top:2px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.chart-card h4{font-size:13px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.hist-row{display:flex;align-items:flex-end;gap:5px;height:110px}
.hist-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hist-col .bar{width:70%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--grad);opacity:.85;transition:height .5s;min-height:2px}
.hist-col .bar.today{opacity:1;box-shadow:0 0 0 2.5px var(--brand-1)}
.hist-col .day{font-size:9.5px;color:var(--faint)}
/* ===== 詞彙詳情彈窗 ===== */
.detail{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.detail .d-cat{display:inline-flex;font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;background:var(--grad-soft);color:var(--brand-1);margin-bottom:10px}
.detail .d-ph{font-size:24px;font-weight:800;margin-bottom:4px}
.detail .d-stars{font-size:12px;color:var(--warn);margin-bottom:10px}
.detail .d-mean{font-size:15px;color:var(--text);line-height:1.6}
.detail .d-ex{font-size:13px;color:var(--sub);background:var(--bg-soft);border-radius:12px;padding:10px 13px;margin-top:10px;line-height:1.6}
.detail .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
/* 引導 */
#guide{position:fixed;inset:0;z-index:300;background:rgba(15,17,30,.66);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#guide.show{display:flex;animation:ovIn .25s}
.guide-card{background:var(--card);border-radius:26px;padding:26px 22px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:sheetUp .35s cubic-bezier(.22,.9,.36,1)}
.guide-card .g-ic{font-size:46px;margin-bottom:12px}
.guide-card h2{font-size:20px;font-weight:800;margin-bottom:8px}
.guide-card p{font-size:13.5px;color:var(--sub);line-height:1.7;margin-bottom:18px}
.guide-skip{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.guide-start{display:block;width:100%;padding:14px;border-radius:16px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(99,102,241,.35)}
/* 深色模式細微修正 */
.dse-tip{font-size:11px;color:var(--sub);background:var(--card);border:1px dashed var(--border-2);border-radius:12px;padding:11px;line-height:1.6}
[data-theme=dark] .wt-fmt,[data-theme=dark] .quiz-opt,[data-theme=dark] .list-item,[data-theme=dark] .stat-card{box-shadow:none}
/* ==== V5.1 進階工具 ==== */
.x-toolbar{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.x-tab{flex:1;min-width:90px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--card);border:1.5px solid var(--border-2);font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .2s}
.x-tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.3)}
.x-tab .ic{display:block;font-size:19px;margin-bottom:3px}
.topic-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer;transition:all .15s}
.topic-card:active{transform:scale(.98)}
.topic-card .n{width:26px;height:26px;border-radius:50%;background:var(--bg-2);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.topic-card .q{font-size:13.5px;font-weight:700;line-height:1.45;flex:1}
.topic-card .go{color:var(--faint);font-size:16px}
.topic-hero{background:var(--grad);border-radius:16px;padding:16px;color:#fff;margin-bottom:12px}
.topic-hero .tq{font-size:15.5px;font-weight:800;line-height:1.5;margin-bottom:6px}
.topic-hero .tg{font-size:11.5px;opacity:.85}
.arg-box{background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:10px}
.arg-box .ah{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-bottom:8px}
.arg-box.pro .ah{color:#10B981}
.arg-box.con .ah{color:#EF4444}
.arg-box .ag{margin:0;padding:0;list-style:none}
.arg-box .ag li{font-size:12.8px;line-height:1.6;color:var(--text);padding:5px 0;border-bottom:1px dashed var(--border-2)}
.arg-box .ag li:last-child{border-bottom:none}
.arg-box .ag li::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:middle}
.ph-chip{display:inline-block;background:var(--bg-2);border:1px solid var(--border-2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;margin:3px 3px 0 0;color:var(--text)}
.timer-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:10px}
.timer-num{font-size:28px;font-weight:900;font-family:ui-monospace,monospace;color:var(--accent);min-width:88px;text-align:center}
.timer-num.warn{color:#EF4444}
.timer-btn{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--bg-2);color:var(--text);border:1px solid var(--border-2)}
.timer-btn.on{background:var(--grad);color:#fff;border-color:transparent}
.side-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;border:1.5px solid var(--border-2);background:var(--card);color:var(--text)}
.side-btn.pro.on{background:#10B981;color:#fff;border-color:transparent}
.side-btn.con.on{background:#EF4444;color:#fff;border-color:transparent}
.step-item{background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:9px}
.step-item .st-t{font-size:13.5px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.step-item .st-t .no{width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-item .st-d{font-size:12.3px;line-height:1.65;color:var(--sub)}
.kw-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kw-tag{background:var(--card);border:1.5px solid var(--border-2);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.kw-tag.on{background:var(--grad);color:#fff;border-color:transparent}
.kw-detail{background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px;margin-bottom:10px}
.kw-detail .kd-t{font-size:13px;font-weight:800;margin-bottom:6px}
.kw-detail .kd-d{font-size:12.3px;line-height:1.65;color:var(--sub)}
[data-theme=dark] .topic-card,[data-theme=dark] .arg-box,[data-theme=dark] .timer-wrap,[data-theme=dark] .step-item,[data-theme=dark] .kw-detail,[data-theme=dark] .x-tab{box-shadow:none}
.pos-tag{display:inline-block;font-size:10px;font-weight:700;color:#7C3AED;background:#F3E8FF;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px;line-height:1.6;white-space:nowrap}
/* ===== UK 音標 ===== */
.fc-phon{margin-top:7px;display:flex;align-items:center;gap:6px;justify-content:center;min-height:26px}
.fc-phon .phon{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;color:var(--grad-start,#7C3AED);font-weight:600;letter-spacing:.3px}
.fc-phon .phon-muted{font-size:11px;color:var(--sub);opacity:.65}
.phon-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border-2);background:var(--card);color:#10B981;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;cursor:pointer;line-height:1.5;vertical-align:1px}
.phon-btn:hover{background:#10B981;color:#fff;border-color:transparent}
.d-phon{margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.d-phon .phon{font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;color:var(--grad-start,#7C3AED);font-weight:600;letter-spacing:.3px}
.d-phon .phon-muted{font-size:11.5px;color:var(--sub);opacity:.7}
.li-phon{font-size:12px;color:var(--grad-start,#7C3AED);font-weight:600;margin-left:4px;letter-spacing:.2px}
.phon-mini{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--border-2);background:var(--card);font-size:12px;cursor:pointer;margin-left:5px;vertical-align:-3px;line-height:1;padding:0;transition:background .15s}
.phon-mini:active{background:#10B981;border-color:#10B981}
.tomo-mini{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--border-2);background:var(--card);font-size:12px;cursor:pointer;margin-left:5px;vertical-align:-3px;line-height:1;padding:0;transition:background .15s,opacity .15s;opacity:.55}
.tomo-mini.on{background:#F59E0B;border-color:#F59E0B;opacity:1;box-shadow:0 0 0 3px rgba(245,158,11,.18);color:#fff}
.tomo-mini:active{background:#F59E0B;border-color:#F59E0B}
.tomo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:6px 10px;margin:2px 2px 8px;font-size:12px;color:#B45309;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>📘 DSE Vocab <span class="sub">V5.0</span></h1>
    <div class="hd-right">
      <button class="icon-btn" id="themeBtn" onclick="App.toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="App.go('stats')">📊</button>
    </div>
  </header>
  <main class="views" id="views">
    <!-- 首頁 -->
    <section class="view active" id="view-home" role="tabpanel"></section>
    <!-- 閃卡 -->
    <section class="view" id="view-flash" role="tabpanel">
      <div class="flash-wrap" id="flashWrap"></div>
    </section>
    <!-- 測驗 -->
    <section class="view" id="view-quiz" role="tabpanel"></section>
    <!-- 詞庫 -->
    <section class="view" id="view-browse" role="tabpanel"></section>
    <!-- 寫作 -->
    <section class="view" id="view-writing" role="tabpanel"></section>
    <!-- 作文評分 -->
    <section class="view" id="view-essay" role="tabpanel"></section>
    <!-- 口語特訓 -->
    <section class="view" id="view-speaking" role="tabpanel"></section>
    <!-- 辯論訓練 -->
    <section class="view" id="view-debate" role="tabpanel"></section>
    <!-- 閱讀拆題 -->
    <section class="view" id="view-reading" role="tabpanel"></section>
    <!-- 聆聽綜合 -->
    <section class="view" id="view-listening" role="tabpanel"></section>
    <!-- 更多 -->
    <section class="view" id="view-more" role="tabpanel"></section>
    <section class="view" id="view-stats" role="tabpanel"></section>
    <!-- 子視圖（動態路由內容） -->
    <section class="view" id="view-sub" role="tabpanel"></section>
  </main>
  <nav class="nav" id="nav">
    <button data-view="home" class="active" onclick="App.go('home')"><span class="ic">🏠</span>首頁</button>
    <button data-view="flash" onclick="App.go('flash')"><span class="ic">🃏</span>閃卡</button>
    <button data-view="quiz" onclick="App.go('quiz')"><span class="ic">📝</span>測驗</button>
    <button data-view="browse" onclick="App.go('browse')"><span class="ic">🔍</span>詞庫</button>
    <button data-view="writing" onclick="App.go('writing')"><span class="ic">✍️</span>寫作</button>
    <button data-view="more" onclick="App.go('more')"><span class="ic">☰</span>更多</button>
  </nav>
</div>
<!-- 詞彙詳情彈窗 -->
<div class="overlay" id="overlay" onclick="if(event.target===this)App.closeSheet()">
  <div class="sheet" style="padding-bottom:calc(20px + env(safe-area-inset-bottom))">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>
</div>
<!-- 引導 -->
<div id="guide" onclick="App.closeGuide()">
  <div class="guide-card" id="guideCard">
    <button class="guide-skip" id="guideSkip" onclick="event.stopPropagation();App.closeGuide()">✕</button>
    <div class="g-ic">🎓</div>
    <h2>歡迎使用 DSE Vocab V5.0</h2>
    <p>全新設計介面 × 底層重構 × 新增 AI 作文評分系統<br>同你並肩衝刺 DSE 英文科！</p>
    <button class="guide-start" onclick="App.closeGuide()">立即開始 🚀</button>
  </div>
</div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
 * DSE Vocab V5.0 — 底層架構
 * ===================================================================== */
const Utils = {
  $: s => document.querySelector(s),
  $$: s => [...document.querySelectorAll(s)],
  esc: s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; },
  today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  posTag(w){ if(!w||!w.pos) return ''; const m={n:'n.',v:'v.',adj:'adj.',adv:'adv.',phr:'phr.'}[w.pos]; return m?`<span class="pos-tag">(${m})</span>`:''; },
  lvFromScore(s){ return s>=90?'5**':s>=82?'5*':s>=74?'5':s>=64?'4':s>=52?'3':s>=40?'2':'1'; },
  lvLabel(lv){ return ({'S級':'5**','A級':'5*','B級':'5','C級':'4','努力級':'1'})[lv]||lv; },
  priorityPlan(lv){
    const map={
      '5**':{tag:'挑戰組', range:[5,5], desc:'已達頂尖，專攻 5★ 進階詞彙', emoji:'🔥'},

/* ===== 詞庫載入 ===== */
const Data = {
  raw:[], byId:new Map(), index:new Map(), __src:'',
  get(id){ const w=Data.byId.get(id); return w||Data.byId.get(Number(id)); },
  async load(){
    const inline=window.__DSE_DATA;
    let words=[];
    const normalize=(c)=>{
      if(!c) return null;
      if(Array.isArray(c)&&c.length) return c;
      if(c.data&&Array.isArray(c.data)&&c.data.length){
        const meta=c.meta||{};
        return c.data.map((r,i)=>({ id:i, phrase:r[0], meaning:r[1], stars:r[2], category:(meta.cats&&meta.cats[r[3]])||('分類'+(r[3]||1)), pos:r[4]||'' }));
      }
      return null;
    };
    words=normalize(inline);
    if(!words){
      const fetcher=async ()=>{
        try{
          const res=await fetch('dse_vocab_data.js', {cache:'no-cache'});
          if(res.ok){ const txt=await res.text(); const m=txt.match(/window\.__DSE_DATA\s*=\s*(\{[\s\S]*\}|\[[\s\S]*\]);?\s*$/); if(m){ try{ return normalize(JSON.parse(m[1])); }catch(e){} } }
        }catch(e){}
        try{
          const res2=await fetch('dse_vocab_data.json', {cache:'no-cache'});
          if(res2.ok){ const j=await res2.json(); const n=normalize(j); if(n&&n.length) return n; }
        }catch(e){}
        return null;
      };
      words=await fetcher();
    }
    if(!words||!words.length) return 0;
    Data.raw=words; Data.byId=new Map(words.map(w=>[w.id,w]));
    Data._buildIndex();
    Data._mergeCustom();
    return words.length;
  },
  _mergeCustom(){
    const cus=(Store.state.customWords||[]);
    if(!cus.length) return;
    const base=9000000;
    const added=cus.map((c,i)=>({ id:'c'+(base+i), phrase:String(c.phrase||'').trim(), meaning:String(c.meaning||'（自訂詞）').trim(), stars:(c.stars>=1&&c.stars<=5)?c.stars:3, category:c.category||'自訂', custom:true }));
    if(!added.length) return;
    Data.raw=[...added, ...Data.raw];
    Data.byId=new Map(Data.raw.map(w=>[w.id,w]));
    Data._buildIndex();
  },
  lvTag(w){
    if(w&&w.custom) return { t:'自訂', c:'#8B5CF6' };
    const s=(w&&w.stars)||3;
    if(s<=2) return { t:'Lv3/4 必備', c:'#3B82F6' };
    if(s<=4) return { t:'Lv5 升級', c:'#F59E0B' };
    return { t:'Lv5** 升級', c:'#A855F7' };
  },
  topicOf(w, _cache){
    if(w&&w._topics) return w._topics;
    const txt=(((w&&w.phrase)||'')+' '+((w&&w.meaning)||'')).toLowerCase();
    const hit=[];
    TOPIC_RULES.forEach(t=>{ if(t.en.some(k=>txt.includes(k))||t.zh.some(k=>txt.includes(k))) hit.push(t.key); });
    if(w) w._topics=hit;
    return hit;
  },
  _buildIndex(){
    const idx=new Map();
    const add=(tok,id)=>{ if(!tok)return; let a=idx.get(tok); if(!a){ a=[]; idx.set(tok,a); } if(a[a.length-1]!==id) a.push(id); };
    Data.raw.forEach(w=>{
      add('#'+w.id, w.id);
      (w.phrase||'').toLowerCase().split(/\s+/).forEach(t=>add(t,w.id));
      const cn=w.meaning; if(cn) add('@'+cn.slice(0,4), w.id);
      add(w.category, w.id);
    });
    Data.index=idx;
  },
  search(q){
    q=(q||'').trim().toLowerCase();
    if(!q) return Data.raw;
    const hits=new Set();
    if(Data.index.has('#'+q)){ Data.index.get('#'+q).forEach(id=>hits.add(id)); }
    Data.raw.forEach(w=>{
      if((w.phrase||'').toLowerCase().includes(q)) hits.add(w.id);
      else if((w.meaning||'').includes(q)) hits.add(w.id);
    });
    const tokens=q.split(/[^a-z0-9']+/).filter(Boolean);
    if(tokens.length>1){ const t0=tokens[0]; (Data.index.get(t0)||[]).forEach(id=>{ const w=Data.get(id); if(w&&tokens.every(t=>(w.phrase||'').toLowerCase().includes(t))) hits.add(id); }); }
    return [...hits].map(id=>Data.get(id));
  }
};

const Dict = {
  _cache:null, _queue:{},
  getCache(){
    if(this._cache) return this._cache;
    try{ this._cache=JSON.parse(localStorage.getItem('dse_phon_v1')||'{}'); }catch(e){ this._cache={}; }
    return this._cache;
  },
  saveCache(){
    const c=this._cache||{};
    const keys=Object.keys(c);
    if(keys.length>3000){
      keys.sort((a,b)=>(c[b].t||0)-(c[a].t||0));
      keys.slice(0,keys.length-2000).forEach(k=>delete c[k]);
    }
    try{ localStorage.setItem('dse_phon_v1', JSON.stringify(c)); }catch(e){}
  },
  isPhrase(p){ return /\s/.test(p); },
  cachedPhonText(w){
    const c=this.getCache()[String(w.phrase||'').toLowerCase().trim()];
    return (c&&c.d&&c.d.text)?Utils.esc(c.d.text):'';
  },
  _observer:null, _inflight:{},
  observeList(){
    if(!('IntersectionObserver' in window)) return;
    if(this._observer) this._observer.disconnect();
    this._observer=new IntersectionObserver(es=>{
      es.forEach(en=>{
        if(!en.isIntersecting) return;
        const li=en.target;
        this._observer.unobserve(li);
        const phEl=li.querySelector('.li-phon[data-ph]');
        if(!phEl) return;
        const k=String(li.getAttribute('data-word')||'').toLowerCase().trim();
        if(!k) return;
        const c=this.getCache();
        if(c[k]&&c[k].d&&c[k].d.text){ phEl.textContent=c[k].d.text; return; }
        if(this._inflight[k]) return;
        this._inflight[k]=true;
        this.phon({phrase:k}).then(d=>{
          if(phEl.isConnected&&d.text){ phEl.textContent=d.text; phEl.classList.add('ok'); }
        }).finally(()=>{ delete this._inflight[k]; });
      });
    },{rootMargin:'250px 0px'});
    document.querySelectorAll('#view-browse .list-item').forEach(li=>this._observer.observe(li));
  },
  async phon(w){
    const raw=String(w.phrase||w);
    const k=raw.toLowerCase().trim();
    const c=this.getCache();
    if(c[k]&&c[k].d){ c[k].t=Date.now(); return c[k].d; }
    if(this._queue[k]) return this._queue[k];
    this._queue[k]=(async()=>{
      const fail={text:'',audio:''};
      try{
        const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k),{signal:AbortSignal.timeout(6000)});
        if(!r.ok) throw 0;
        const arr=await r.json();
        if(!Array.isArray(arr)||!arr.length) throw 0;
        const e=arr[0], ph=e.phonetics||[];
        let text=e.phonetic||'', audio='';
        for(const p of ph){ if(p.audio&&/[-_](uk|gb)/i.test(p.audio)){ audio=p.audio; if(p.text) text=p.text; break; } }
        if(!audio){ for(const p of ph){ if(p.audio){ audio=p.audio; if(p.text) text=p.text; break; } } }
        const d={text,audio};
        c[k]={d,t:Date.now()}; this.saveCache();
        return d;
      }catch(e){ c[k]={d:fail,t:Date.now()}; this.saveCache(); return fail; }
    })();
    try{ return await this._queue[k]; }finally{ delete this._queue[k]; }
  },
  speakUK(text){

      if(!('speechSynthesis' in window)){ Utils.toast('瀏覽器唔支援語音'); return; }

      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-GB'; u.rate=0.8;
      const vs=speechSynthesis.getVoices();
      const v=vs.find(x=>/en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  playAudio(url){

/* ===== SM-2 演算法 ===== */
const SM2 = {
  /* 自適應節奏：錯詞比例高 -> 放慢複習節奏，先打穩基礎 */
  adaptive(){
    const s=Store.state;
    const tot=s.known.size+s.wrong.size;
    if(!tot) return 1;
    const wrongRate=s.wrong.size/tot;
    if(wrongRate>0.35) return 0.6;
    if(wrongRate>0.2) return 0.8;
    return 1;
  },
  review(w, quality){
    const s=Store.state;
    const k=Store.key(w);
    const cur=s.sched[k]||{int:0,rep:0,due:Date.now(),ef:2.5};
    let {int,rep,ef}=cur;
    if(quality>=3){
      if(rep===0) int=1;
      else if(rep===1) int=Math.round(6*SM2.adaptive());
      else int=Math.round(int*ef);
      rep++;
    }else{
      rep=0; int=1;
    }
    ef=Math.max(1.3, ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    const due=Date.now()+int*86400000;
    s.sched[k]={int,rep,due,ef};
    return {int,rep,ef,due};
  },
  duePool(cat, star){
    const s=Store.state;
    const now=Date.now();
    const all=cat==='all'?Data.raw:Data.raw.filter(w=>w.category===cat);
    const pool=star>1?all.filter(w=>w.stars>=star):all;
    const tomo=pool.filter(w=>s.tomo.has(Store.key(w)));
    const due=pool.filter(w=>{ const x=s.sched[Store.key(w)]; return x&&x.due<=now&&!s.tomo.has(Store.key(w)); });
    const fresh=pool.filter(w=>{ const k=Store.key(w); return !s.sched[k]&&!s.known.has(k)&&!s.tomo.has(k); });
    const review=pool.filter(w=>s.wrong.has(Store.key(w))&&!due.includes(w)&&!fresh.includes(w)&&!tomo.includes(w));
    const rest=pool.filter(w=>!due.includes(w)&&!fresh.includes(w)&&!review.includes(w)&&!tomo.includes(w));
    const q=[...tomo, ...due.sort((a,b)=>s.sched[Store.key(a)].due-s.sched[Store.key(b)].due), ...Utils.shuffle(fresh), ...Utils.shuffle(review), ...Utils.shuffle(rest)];
    return q;
  }
};

    Flash.flipped=false;
    Flash.render();
  },

      <div class="wt-grid">
        ${WRITING_PICKS.map((g,i)=>`<div class="wt-fmt" onclick="WritingToolkit._pick=${i};WritingToolkit.render()"><div class="t">${Utils.esc(g.g)}</div><div class="p">${g.items.length} 條片語</div></div>`).join('')}

const WRITING_PICKS = [
  { g: "議題通用（Part 2）", items: [
    { t: "raise concerns about", m: "引發對…的擔憂", syn: "trigger worries about / give rise to concern over", use: "議論文指出風險、質疑政策", reg: "formal", ex: ["The new policy raises concerns about students' privacy.", "Experts have raised concerns about the safety of the new drug.", "The plan raises concerns about the future of small businesses."] },
    { t: "erode public trust in", m: "削弱公眾對…的信任", syn: "undermine confidence in / damage faith in", use: "指出醜聞、假新聞的負面影響", reg: "formal", ex: ["Repeated scandals have eroded public trust in the media.", "Fake news erodes public trust in reliable information.", "Corruption erodes public trust in the government."] },
    { t: "be susceptible to", m: "容易受到…影響", syn: "be vulnerable to / be prone to / be liable to", use: "描述群體或系統的弱點", reg: "formal", ex: ["Teenagers are susceptible to peer pressure and online trends.", "The elderly are susceptible to respiratory diseases in winter.", "Young users are susceptible to misinformation on social media."] },
    { t: "polarise public opinion on", m: "使公眾在…上意見兩極分化", syn: "divide public opinion / split views on", use: "討論爭議性議題", reg: "formal", ex: ["The issue of school uniforms has polarised public opinion.", "The new law polarised public opinion across the city.", "Social media tends to polarise public opinion on controversial topics."] },
    { t: "hold ... accountable for", m: "要求…對…負責", syn: "make ... answer for / hold ... responsible for", use: "要求政府、企業承擔責任", reg: "formal", ex: ["The public wants the government to hold polluters accountable for the damage.", "Schools should hold students accountable for their behaviour.", "Consumers now hold brands accountable for their environmental record."] },
    { t: "expose ... to", m: "使…暴露於；令…接觸", syn: "subject ... to / leave ... open to", use: "指出風險、接觸不良影響", reg: "formal", ex: ["Social media exposes young people to unrealistic body images.", "Poor data protection exposes users to identity theft.", "Travelling exposes students to new cultures and ideas."] },
    { t: "be driven by", m: "由…驅動；以…為主導", syn: "be motivated by / be fuelled by", use: "分析行為、市場背後的動力", reg: "formal", ex: ["Online shopping is driven by convenience and low prices.", "His success is driven by curiosity and hard work.", "The tourism boom is driven by the rise of social media."] },
    { t: "be reinforced by", m: "被…進一步強化", syn: "be strengthened by / be amplified by", use: "分析偏見、習慣被加深", reg: "formal", ex: ["Stereotypes are reinforced by biased media portrayals.", "Bad habits are reinforced by immediate rewards.", "Prejudice is reinforced by a lack of contact between groups."] },
    { t: "give ... greater control over", m: "賦予…更大控制權", syn: "empower ... to control / hand ... more power over", use: "建議賦權用戶、公民", reg: "formal", ex: ["The app gives users greater control over their own data.", "New rules give parents greater control over children's screen time.", "The reform gives schools greater control over their budgets."] },
    { t: "be fundamental to", m: "對…至關重要；是…的基礎", syn: "be essential to / be vital to / underlie", use: "強調核心價值、基礎條件", reg: "formal", ex: ["Trust is fundamental to any successful relationship.", "Basic literacy is fundamental to lifelong learning.", "Free speech is fundamental to a healthy democracy."] },
    { t: "equip ... with", m: "使…具備（能力/技能）", syn: "provide ... with / arm ... with", use: "談教育、培訓的成效", reg: "formal", ex: ["Schools should equip students with critical thinking skills.", "The course equips graduates with practical job skills.", "Technology equips teachers with powerful new tools."] },
    { t: "serve as an effective vehicle for", m: "成為…的有效途徑/媒介", syn: "act as a means of / provide an effective channel for", use: "談媒介、渠道的功用", reg: "formal", ex: ["Social media serves as an effective vehicle for spreading health messages.", "Volunteering serves as an effective vehicle for personal growth.", "The arts serve as an effective vehicle for cultural exchange."] },
    { t: "be weaponised for", m: "被用作…的武器；被利用來", syn: "be exploited for / be misused for", use: "談科技、資訊被濫用", reg: "formal", ex: ["Deepfakes can be weaponised for political manipulation.", "Personal data can be weaponised for targeted scams.", "Language can be weaponised for online bullying."] },
    { t: "cause lasting harm to", m: "對…造成持久的傷害", syn: "do lasting damage to / inflict long-term harm on", use: "指出嚴重、長遠後果", reg: "formal", ex: ["Cyberbullying can cause lasting harm to a victim's mental health.", "Pollution causes lasting harm to marine ecosystems.", "False accusations cause lasting harm to innocent people."] },
    { t: "be indistinguishable from", m: "與…難以區分", syn: "be almost identical to / be impossible to tell apart from", use: "談 AI 內容、仿冒品", reg: "formal", ex: ["AI-generated images are now indistinguishable from real photographs.", "Counterfeit goods are indistinguishable from genuine products.", "Fake reviews are indistinguishable from authentic ones."] },
    { t: "be difficult to erase", m: "難以消除；難以抹去", syn: "be hard to remove / be permanent", use: "談網絡足跡、污名", reg: "formal", ex: ["A negative digital footprint is difficult to erase once online.", "The stain on the company's reputation is difficult to erase.", "Regret is difficult to erase from one's memory."] },
    { t: "make inroads into", m: "在…取得進展；打入", syn: "make progress in / penetrate / gain ground in", use: "談改革、市場拓展成效", reg: "formal", ex: ["The campaign has made inroads into reducing plastic waste.", "Online learning is making inroads into traditional classrooms.", "The brand is making inroads into the overseas market."] },
    { t: "fall victim to", m: "成為…的受害者", syn: "be prey to / suffer from", use: "談詐騙、網絡風險", reg: "semi-formal", ex: ["Many elderly people fall victim to online scams every year.", "Young users often fall victim to fake news online.", "Without proper training, hikers may fall victim to sudden storms."] },
  ] },
  { g: "立場表態", items: [
    { t: "be in favor of", m: "贊成；支持", syn: "support / advocate / stand behind", use: "議論文表明立場、書信支持某方案", reg: "semi-formal", ex: ["I am strongly in favor of banning single-use plastics in school canteens.", "Many parents are in favor of reducing homework, arguing that it leaves more time for family life.", "The committee was in favor of the proposal despite some reservations."] },
    { t: "side with", m: "支持；站在…一邊", syn: "back / take the side of / stand by", use: "辯論、立場鮮明的段落", reg: "informal", ex: ["On this issue, I side with those who believe online learning can never replace face-to-face interaction.", "Although the government sided with the developers, residents continued to protest.", "More students now side with the view that examinations should be less stressful."] },
    { t: "be open to debate", m: "有待討論；未有定論", syn: "be debatable / be a matter of opinion", use: "承認議題有爭議空間，引入反方觀點", reg: "formal", ex: ["Whether social media does more harm than good remains open to debate.", "The effectiveness of the new policy is open to debate among educators.", "Whether homework should be abolished is open to debate."] },

const Quiz = {
  qs:[], idx:0, score:0, answered:false, cat:'all', mode:'choice', timed:false, timeLeft:0, _timer:null,
  enter(){ Quiz._setup(); },
  _setup(){
    const s=Store.state;
    const cat=Quiz.cat;
    let pool=cat==='all'?Data.raw:Data.raw.filter(w=>w.category===cat);
    if(Quiz.mode==='known') pool=pool.filter(w=>s.known.has(Store.key(w)));
    if(Quiz.mode==='wrong') pool=pool.filter(w=>s.wrong.has(Store.key(w)));
    if(pool.length<4){ Utils.toast('詞彙不足，試下其他範圍'); return; }
    // DSE Level 優先級加權抽題：70% 來自推薦星級範圍，30% 其他
    const plan=Utils.priorityPlan((Store.state.lvTest&&Store.state.lvTest.lv)||'');
    let picked;
    if(plan&&plan.range&&pool.length>=10){
      const lo=plan.range[0], hi=plan.range[1];
      const focus=pool.filter(w=>w.stars>=lo&&w.stars<=hi);
      const rest=pool.filter(w=>w.stars<lo||w.stars>hi);
      const nFocus=Math.min(focus.length, Math.round(10*0.7));
      const nRest=Math.min(rest.length, 10-nFocus);
      picked=[...Utils.shuffle(focus).slice(0,nFocus), ...Utils.shuffle(rest).slice(0,nRest)];
      if(picked.length<10) picked=[...picked, ...Utils.shuffle(pool.filter(w=>!picked.includes(w))).slice(0,10-picked.length)];
      picked=Utils.shuffle(picked);
    } else {
      picked=Utils.shuffle(pool).slice(0,10);
    }
    Quiz.qs=picked.map(w=>{
      const opts=Utils.shuffle(pool).filter(x=>x.id!==w.id).slice(0,3);
      const all=Utils.shuffle([w,...opts]);
      return {w, opts:all};
    });
    Quiz.idx=0; Quiz.score=0; Quiz.answered=false;
    if(Quiz.timed){ Quiz.timeLeft=Quiz.qs.length*15; Quiz._startTimer(); }
    Quiz.render();
  },
  _startTimer(){
    clearInterval(Quiz._timer);
    Quiz._timer=setInterval(()=>{
      Quiz.timeLeft--;
      const el=Utils.$('#quizTimer'); if(el) el.textContent='⏱ '+Quiz.timeLeft+'s';
      if(Quiz.timeLeft<=0){ clearInterval(Quiz._timer); Quiz.finish(); }
    },1000);
  },
  _stopTimer(){ clearInterval(Quiz._timer); Quiz._timer=null; },
  finish(){
    clearInterval(Quiz._timer);
    const total=Quiz.qs.length;
    const pct=total?Math.round(Quiz.score/total*100):0;
    if(pct>Store.state.quizBest){ Store.state.quizBest=pct; Store.persist(); }
    Utils.unlockCheck();
    const v=Utils.$('#view-quiz');
    v.innerHTML=`
      <div class="empty" style="padding-top:60px"><div class="e-icon">🏁</div>
      <div style="font-size:22px;font-weight:800;margin:10px 0 4px">測驗完成</div>
      <div style="color:var(--sub)">答啱 ${Quiz.score} / ${total} 題（${pct}%）</div>
      ${Quiz.timed?`<div style="color:var(--sub);margin-top:2px">計時模式</div>`:''}
      <div style="margin-top:18px;display:flex;gap:8px;justify-content:center">
        <button class="btn sm ghost" onclick="Quiz.timed=false;Quiz.enter()">再測一次</button>
        <button class="btn sm" onclick="Quiz.timed=!Quiz.timed;Quiz.enter()">${Quiz.timed?'轉普通':'轉計時'}模式</button>
      </div></div>`;
  },
  render(){
    const v=Utils.$('#view-quiz');
    if(!Quiz.qs.length){ v.innerHTML=`<div class="empty"><div class="e-icon">📝</div>撳下面開始測驗</div>`; return; }
    const q=Quiz.qs[Quiz.idx];
    const pct=Math.round(Quiz.idx/Quiz.qs.length*100);
    v.innerHTML=`
      <div class="quiz-progress"><div class="quiz-fill" style="width:${pct}%"></div></div>
      <div class="quiz-meta"><span>${Quiz.idx+1} / ${Quiz.qs.length}</span><span>答啱 ${Quiz.score}</span></div>
      <div class="quiz-card">
        <div class="quiz-q">${Utils.esc(q.w.meaning)}</div>
        <div class="quiz-opts">
          ${q.opts.map((o,i)=>`<button class="quiz-opt ${Quiz.answered?(o.id===q.w.id?'correct':(Quiz._picked===o.id?'wrong':'')):''}" onclick="Quiz.pick(${i})"><span class="qk">${'ABCD'[i]}</span><span>${Utils.esc(o.phrase)} ${Utils.posTag(o)}</span></button>`).join('')}
        </div>
        ${Quiz.answered?`<div class="quiz-explain show">✅ 正確答案：<b>${Utils.esc(q.w.phrase)} ${Utils.posTag(q.w)}</b>${q.w.example?`<br>📝 ${Utils.esc(q.w.example)}`:''}<br><button class="btn sm soft" style="margin-top:10px" onclick="Quiz.next()">下一題 →</button></div>`:''}
      </div>
    `;
  },
  pick(i){
    if(Quiz.answered) return;
    const q=Quiz.qs[Quiz.idx];
    Quiz.answered=true; Quiz._picked=q.opts[i].id;
    const ok=q.opts[i].id===q.w.id;
    if(ok){ Quiz.score++; Store.state.known.add(Store.key(q.w)); }
    else Store.state.wrong.add(Store.key(q.w));
    const today=Utils.today();
    Store.state.history[today]=(Store.state.history[today]||0)+1;
    Store.state.quizCount=(Store.state.quizCount||0)+1;
    Store.persist(); Store.notify();
    Quiz.render();
  },
  next(){
    Quiz.idx++;
    if(Quiz.idx>=Quiz.qs.length){
      const pct=Math.round(Quiz.score/Quiz.qs.length*100);
      Utils.$('#view-quiz').innerHTML=`
        <div class="empty">
          <div class="e-icon">${pct>=80?'🏆':pct>=60?'💪':'📚'}</div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px">${Quiz.score} / ${Quiz.qs.length}</div>
          <div style="margin-bottom:18px">正確率 ${pct}%${pct>=80?' · 好犀利！':pct>=60?' · 繼續努力！':' · 錯詞已加入複習'}</div>
          <button class="btn" onclick="Quiz._setup()">再測一次</button>
          <button class="btn ghost sm" style="margin-top:10px" onclick="App.go('home')">返回首頁</button>
        </div>`;
      Store.notify();
      return;
    }
    Quiz.answered=false;
    Quiz.render();
  },
  /* 測驗設置面板（喺詞庫頁撳入） */
  settingsHtml(){
    return `
      <div class="section-title"><span class="dot"></span>測驗設置</div>
      <div class="card" style="margin-bottom:12px">
        <div class="setting-row"><div class="st-info"><div class="st-t">範圍</div><div class="st-d">選擇測驗詞庫範圍</div></div>
          <select class="field" style="width:130px;padding:8px 10px" id="quizCat">
            <option value="all">全部詞庫</option>
            ${[...new Set(Data.raw.map(w=>w.category))].map(c=>`<option value="${Utils.esc(c)}">${Utils.esc(c)}</option>`).join('')}
          </select></div>
        <div class="setting-row"><div class="st-info"><div class="st-t">詞彙類型</div><div class="st-d">限縮測驗對象</div></div>
          <select class="field" style="width:130px;padding:8px 10px" id="quizMode">
            <option value="all">全部</option><option value="known">已掌握</option><option value="wrong">常錯詞</option>
          </select></div>
        <button class="btn" style="width:100%;margin-top:8px" onclick="Quiz.startFromSettings()">開始測驗</button>
      </div>`;
  },
  startFromSettings(){
    Quiz.cat=Utils.$('#quizCat').value;
    Quiz.mode=Utils.$('#quizMode').value;
    Quiz._setup();
    UI.go('quiz');
  }
};

const Browse = {

const Collo = {
  _idx:null,
  build(){
    const map=new Map();
    const add=(phrase,src,m)=>{
      if(!phrase) return;
      const ph=String(phrase).toLowerCase().trim();
      if(ph.length>2){
        let a=map.get(ph); if(!a){ a=[]; map.set(ph,a); } a.push({ p:phrase, s:src, m:m||'' });
      }
      const tokens=ph.split(/[^a-z']+/).filter(t=>t.length>2);
      tokens.forEach(t=>{ let a=map.get(t); if(!a){ a=[]; map.set(t,a); } a.push({ p:phrase, s:src, m:m||'' }); });
    };
    (WRITING_PICKS||[]).forEach(g=>(g.items||[]).forEach(it=>{ add(it.t,'寫作片語',it.m); (it.ex||[]).forEach(e=>add(e,'寫作例句',it.m)); }));
    (TOPIC_PHRASES||[]).forEach(t=>(t.groups||[]).forEach(g=>(g.items||[]).forEach(it=>{ add(it.t,'議題短語',it.m); (it.ex||[]).forEach(e=>add(e,'議題例句',it.m)); })));
    (ATTITUDE_WORDS||[]).forEach(t=>(t.groups||[]).forEach(g=>(g.items||[]).forEach(it=>add(it.t,'態度詞',it.m))));
    Object.values(WRITING_MAP||{}).forEach(f=>(f.phrases||[]).forEach(p=>{ add(p.text,'格式詞庫',p.meaning); (p.ex||[]).forEach(e=>add(e,'格式例句',p.meaning)); }));
    Object.values(SENTENCE_STRUCTURES||{}).forEach(c=>(c.items||[]).forEach(s=>add(s.e||s.p,'進階句式','')));
    Collo._idx=map;
  },
  variants(p){
    const v=new Set([p]);
    if(!p) return [...v];
    if(p.endsWith('ies')) v.add(p.slice(0,-3)+'y');
    if(p.endsWith('es')) v.add(p.slice(0,-2));
    if(p.endsWith('s')&&p.length>3) v.add(p.slice(0,-1));
    if(p.endsWith('ing')&&p.length>5) v.add(p.slice(0,-3));
    if(p.endsWith('ed')&&p.length>4) v.add(p.slice(0,-2));
    if(p.endsWith('d')&&p.length>3&&!p.endsWith('ed')) v.add(p.slice(0,-1));
    if(p.endsWith('e')&&p.length>3) v.add(p.slice(0,-1));
    v.add(p+'s'); v.add(p+'es'); v.add(p+'al'); v.add(p+'ing'); v.add(p+'ed');
    return [...v];
  },
  for(w,limit){
    if(!Collo._idx) Collo.build();
    const p=String(w&&w.phrase||'').toLowerCase().trim();
    if(!p) return [];
    const hits=[], seen=new Set();
    const collect=k=>{ (Collo._idx.get(k)||[]).forEach(x=>{ const kk=x.p+'|'+x.s; if(!seen.has(kk)){ seen.add(kk); hits.push(x); } }); };
    collect(p);
    const compact=p.replace(/[^a-z']/g,'');
    if(compact!==p) collect(compact);
    const toks=p.split(/[^a-z']+/).filter(t=>t.length>2);
    toks.forEach(t=>Collo.variants(t).forEach(collect));
    hits.sort((a,b)=>{
      const da=a.p.toLowerCase().includes(p)?1:0, db=b.p.toLowerCase().includes(p)?1:0;
      if(da!==db) return db-da;
      return a.p.length-b.p.length;
    });
    return hits.slice(0,limit||5);
  }
};

        const parts=ln.split(/[|,\t]/).map(s=>s.trim());

};

const EssayGrader = {
  topic:'', text:'', result:null, loading:false,
  /* V5.11.9 UK 讀音（音標 + UK 發音） */
  exam:{active:false, minutes:120, left:0, timer:null, goal:500},
  prompts:[
    'Some people believe that social media has more negative effects than positive effects on young people. Do you agree?',
    'Your school is considering banning smartphones on campus. Write an article expressing your views.',
    'Hong Kong should do more to tackle plastic pollution. Write a letter to the editor to express your views.',
    'Many young people in Hong Kong are reluctant to pursue further studies. What are your views?',
    'Volunteering should be a compulsory part of the school curriculum. Do you agree?',
    'Technology has made our lives more stressful rather than more convenient. Do you agree?',
    'Your school is planning to organise a community service day. Write a proposal to the principal.',
    'Write a story that begins with the sentence: "It was the strangest day of my life."',
    'Some people argue that exams should be abolished. Write an article discussing the pros and cons.',
    'Write a letter to a friend about a memorable experience you had recently.'
  ],
  /* ---------- 離線分析核心 ---------- */
  analyzeLocal(text){
    const lower=(text||'').toLowerCase();
    const words=lower.match(/[a-z']+/g)||[];
    const wordCount=words.length;
    const sentences=text.match(/[^.!?]+[.!?]+/g)||[];
    const sentCount=Math.max(1,sentences.length);
    const paras=Utils.paragraphs(text);
    const paraCount=paras.length;
    const freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1);
    const uniq=Object.keys(freq).length;
    const avgLen=wordCount&&sentCount?Math.round(wordCount/sentCount*10)/10:0;
    const lens=sentences.map(s=>Utils.wordCount(s));
    const longCnt=lens.filter(l=>l>=18).length;
    const shortCnt=lens.filter(l=>l<=6).length;
    const variety=Math.min(1,(longCnt+shortCnt)/sentCount);
    const connectors=['firstly','secondly','thirdly','finally','next','then','moreover','furthermore','in addition','additionally','besides','however','nevertheless','nonetheless','on the other hand','in contrast','conversely','therefore','thus','hence','consequently','as a result','accordingly','for example','for instance','in particular','such as','in conclusion','to sum up','overall','in summary','lastly','in short','as well as','not only','on the whole','in general'];
    const connUsed=connectors.filter(c=>lower.includes(c));
    const connCount=connectors.reduce((n,c)=>{ const m=lower.match(new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')); return n+(m?m.length:0); },0);
    const connUniq=new Set(connUsed).size;
    let advancedHits=[];
    if(Data.raw.length){
      const advPool=Data.raw.filter(w=>w.stars>=3||/進階|潮語|慣用/.test(w.category||''));
      advancedHits=advPool.filter(w=>{
        const ph=(w.phrase||'').toLowerCase();
        return ph.split(/\s+/).length>1 ? lower.includes(ph) : words.includes(ph);
      }).slice(0,12);
    }
    const advRatio=wordCount?Math.round(advancedHits.length/wordCount*1000)/10:0;
    const attitudeHits=EssayGrader._scanAttitude(lower,words);
    const upgrades=EssayGrader._scanUpgrades(words);
    const stop=new Set(['the','a','an','and','or','but','of','to','in','on','at','for','with','is','are','was','were','be','been','i','you','he','she','it','we','they','my','your','his','her','our','their','this','that','these','those','as','by','from','up','down','so','if','not','can','will','would','should','could','may','might','there','have','has','had','do','does','did']);
    const rep=Object.entries(freq).filter(([w,n])=>n>=5&&!stop.has(w)).map(([w,n])=>`${w}×${n}`);
    const repPenalty=Math.min(3, rep.length*0.8);
    const grammarChecks=[
      {re:/\b(a)\s+([aeiou])/gi, msg:'不定冠詞錯誤：a 後面接母音開頭應為 an'},
      {re:/\bi\s+(is|am|are)\b/gi, msg:'人稱代詞 I 必須大寫'},
      {re:/\b(the|a|an)\s+(\w+)s\s+(is|was)\b/gi, msg:'主謂一致可疑：單數主語配複數動詞'},
      {re:/\b(recieve|definately|goverment|accomodate|enviroment|becuase|wich|peice|seperate|occured|freind|beleive|tommorow|adress|alot)\b/gi, msg:'常見拼寫錯誤'},
      {re:/\b(there)\s+(is|are)\s+(\w+)s\b/gi, msg:'there is/are 搭配需檢查'},
      {re:/\b(is|are|was|were)\s+(\w+)ed\b/gi, msg:'動詞時態 / 被動語態需檢查'}
    ];
    const grammarIssues=[];
    grammarChecks.forEach(g=>{ const m=text.match(g.re); if(m&&m[0]){ grammarIssues.push({msg:g.msg, found:m[0]}); } });
    let content=5;
    if(wordCount>=550) content=9;
    else if(wordCount>=450) content=8.5;
    else if(wordCount>=350) content=7.5;
    else if(wordCount>=250) content=6;
    else if(wordCount>=150) content=4.5;
    else content=Math.max(1,Math.round(wordCount/40));
    if(paraCount>=3&&paraCount<=6) content=Math.min(10,content+1);
    else if(paraCount>=2) content=Math.min(10,content+0.4);
    if(connCount>=4) content=Math.min(10,content+0.5);
    if(/for example|for instance|such as|a case in point|take .* as an example/i.test(text)) content=Math.min(10,content+0.5);

    else if(paraCount>=2) org+=1.2;

    if(/in my opinion|i believe|i think|from my perspective|it is widely|nowadays|in recent years/i.test(text)) org+=0.8;

    let lang=4;

    else if(avgLen>=8&&avgLen<=24) lang+=1.2;
    lang+=Math.min(2, advRatio*0.8);
    lang+=variety*1.2;
    lang-=Math.min(2.5, grammarIssues.length*0.7);

  levelOf(total){

    if(total>=24) return {lv:'5*', tag:'優秀', color:'#10B981'};
    if(total>=21) return {lv:'5', tag:'良好', color:'#22C55E'};
    if(total>=18) return {lv:'4', tag:'中上', color:'#0EA5E9'};
    if(total>=15) return {lv:'3', tag:'中等', color:'#6366F1'};
    if(total>=11) return {lv:'2', tag:'需加強', color:'#F97316'};
    return {lv:'1', tag:'有待提升', color:'#EF4444'};
  },
  /* 語氣態度詞掃描（V5.10）：回傳 {pos:[],neg:[],neu:[]}，每項含 {t,m} */
  _scanAttitude(lower,words){
    const hits={pos:[],neg:[],neu:[]};
    if(!ATTITUDE_WORDS||!ATTITUDE_WORDS.length) return hits;
    const seen=new Set();
    ATTITUDE_WORDS.forEach((att,ai)=>{
      const slot=ai===0?'pos':ai===1?'neg':'neu';
      att.groups.forEach(g=>g.items.forEach(p=>{
        const t=(p.t||'').toLowerCase();
        if(!t||seen.has(t)) return;
        seen.add(t);
        const ph=t.split(/\s+/).length>1;
        const found=ph?lower.includes(t):words.includes(t);
        if(found) hits[slot].push({t:p.t,m:p.m});
      }));
    });
    return hits;
  },
  /* V5.11.6 平淡詞掃描（回傳可升級清單，每項 {t, n, up, type}） */
  _scanUpgrades(words){
    const freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1);
    const res=[];
    const already=new Set(words);
    UPGRADE_MAP.forEach(ent=>{
      const base=ent.base;
      const forms=[base,base+'s',base+'es',base+'ed',base+'d',base+'ing',base+'ied',base+'ies',base+'er',base+'est',base+'r',base+'st'];
      let n=0; forms.forEach(f=>{ if(freq[f]) n+=freq[f]; });
      if(n<=0) return;
      const usable=ent.up.filter(u=>u.split(/\s+/).length>1||!already.has(u));
      if(!usable.length) return;
      res.push({t:base, n, up:usable.slice(0,3), type:ent.type});
    });
    return res.sort((a,b)=>b.n-a.n).slice(0,8);
  },
  _buildFeedback(m){
    const {wordCount,sentCount,paraCount,avgLen,connCount,connUniq,advancedHits,advRatio,rep,grammarIssues,longCnt,shortCnt,variety,attitudeHits,upgrades}=m;
    const strengths=[], weaknesses=[], tips=[];
    if(wordCount>=450) strengths.push(`字數充足（${wordCount} 字），能完整展開論點`);
    else if(wordCount>=300) strengths.push(`字數達標（${wordCount} 字），論述具一定深度`);
    else weaknesses.push(`字數不足（${wordCount} 字），DSE Paper 2 建議約 500 字`);
    if(paraCount>=3&&paraCount<=6) strengths.push(`段落結構清晰（${paraCount} 段）`);
    else if(paraCount<3) weaknesses.push(`段落太少（${paraCount} 段），論點應分開逐段論述`);
    else weaknesses.push(`段落偏多（${paraCount} 段），注意段落主題統一`);
    if(connCount>=5) strengths.push(`連接詞運用豐富（${connCount} 次、${connUniq} 種）`);
    else if(connCount>=3) strengths.push(`已使用連接詞（${connCount} 次），可增加多樣性`);
    else weaknesses.push(`連接詞偏少（${connCount} 次），文章欠流暢過渡`);
    if(avgLen>=10&&avgLen<=20) strengths.push(`平均句長適中（${avgLen} 詞／句），可讀性佳`);
    else if(avgLen>20) weaknesses.push(`平均句長偏長（${avgLen} 詞／句），注意避免冗長`);
    else weaknesses.push(`平均句長偏短（${avgLen} 詞／句），可嘗試加入複雜句式`);
    if(longCnt>=2&&shortCnt>=2) strengths.push(`長短句搭配得宜，句式富節奏感`);
    else tips.push('嘗試混合長短句（如 18 詞以上長句 + 6 詞以內短句），提升文章節奏');
    if(advancedHits.length>=3){
      strengths.push(`詞彙水平高：用到 ${advancedHits.slice(0,5).map(x=>x.phrase).join('、')} 等高階詞`);
      tips.push('高階詞使用恰當，可持續擴大進階詞彙庫（參考「進階詞彙A／進階短語B」分類）');
    }else if(advancedHits.length>0){
      tips.push(`已見高階詞（${advancedHits.map(x=>x.phrase).join('、')}），可再增加 2-3 個提升詞彙分`);
    }else{
      weaknesses.push('未見明顯高階詞彙，可到「進階詞彙A／進階短語B」分類學習替換常用詞');
    }
    if(rep.length) weaknesses.push(`常用詞重複（${rep.slice(0,4).join('、')}），可嘗試用同義詞替換`);
    if(attitudeHits){
      const attTotal=attitudeHits.pos.length+attitudeHits.neg.length;
      const attWords=[...attitudeHits.pos.slice(0,3).map(x=>x.t),...attitudeHits.neg.slice(0,3).map(x=>x.t)];
      if(attTotal>=4){
        strengths.push(`語氣態度詞運用豐富（${attWords.slice(0,5).join('、')}…），立場鮮明有態度`);
      }else if(attTotal>=1){
        tips.push(`已用語氣態度詞（${attWords.slice(0,5).join('、')}），可再加 1-2 個強化立場（參考「寫作工具箱 → 語氣態度詞」）`);
      }else{
        weaknesses.push('未見明顯語氣／態度詞，文章立場平淡；可到「寫作工具箱 → 語氣態度詞」學習表達態度');
      }
    }
    if(grammarIssues.length){
      grammarIssues.slice(0,5).forEach(g=>weaknesses.push(`文法／拼寫：${g.msg}（見到「${g.found}」）`));
    }else if(wordCount>100) strengths.push('未偵測到明顯文法／拼寫錯誤');
    if(upgrades&&upgrades.length){
      tips.push(`「詞彙升級」可用：${upgrades.slice(0,3).map(u=>`${u.t} → ${u.up[0]}`).join('、')}（詳見下方⬆️升級建議）`);
    }
    tips.push('寫完後重讀一遍，檢查主謂一致、時態統一同標點符號');
    return {strengths:strengths.slice(0,6), weaknesses:weaknesses.slice(0,6), tips:tips.slice(0,5)};
  },
  /* ---------- LLM API 評分 ---------- */
  async analyzeAPI(text){
    const cfg=Store.state.essay;
    const base=cfg.provider==='openai'?'https://api.openai.com/v1/chat/completions':'https://api.deepseek.com/chat/completions';
    const sys=`You are an experienced HKDSE English Paper 2 examiner. Grade the essay according to the HKDSE marking scheme: Content (/10), Organisation (/10) and Language (/10). Respond ONLY with valid JSON in this exact format: {"content":number,"organisation":number,"language":number,"comment":"overall comment in Chinese","strengths":["..."],"improvements":["..."]}`;
    const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:'Essay to grade:\n'+text}],temperature:0.3,max_tokens:900,response_format:{type:'json_object'}})});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
    const j=await res.json();
    const raw=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
    const parsed=JSON.parse(raw.replace(/^```json\s*/,'').replace(/```$/,'').trim());
    const total=Math.round((Number(parsed.content)+Number(parsed.organisation)+Number(parsed.language))*10)/10;
    return {content:Number(parsed.content),organisation:Number(parsed.organisation),language:Number(parsed.language),total,level:EssayGrader.levelOf(total),mode:'api',comment:parsed.comment||'',strengths:parsed.strengths||[],improvements:parsed.improvements||[]};
  },

  SAMPLE:{title:'5** 示範文（議論體）', body:`In recent years, social media has become an inseparable part of young people's daily lives. While it is often blamed for its negative impact on teenagers, I believe that social media is a double-edged sword whose effects depend largely on how it is used.

To begin with, it is undeniable that social media offers unprecedented opportunities for learning and connection. Students can gain instant access to global news, educational resources and online courses that were once beyond their reach. Moreover, platforms such as Instagram and YouTube enable young people to showcase their creativity and build digital literacy, which is increasingly valued in the modern workplace. A case in point is the growing number of student-run accounts that raise awareness of environmental issues.

Nevertheless, the potential dangers of social media should not be overlooked. One major concern is cyberbullying, which can have a devastating effect on teenagers' mental health. Unlike traditional bullying, online harassment follows victims everywhere, making it difficult to escape. In addition, the addictive nature of these platforms often leads to excessive screen time, which in turn causes sleep deprivation and poor concentration in class.

From my perspective, the key lies in striking a balance rather than imposing a total ban. Schools should incorporate digital literacy into the curriculum, teaching students how to identify reliable information and protect their privacy online. Parents, for their part, can set reasonable boundaries on screen time while remaining open to dialogue with their children.

To conclude, social media is neither entirely beneficial nor wholly harmful. If we equip young people with the skills to use it wisely, it can become a powerful tool for growth rather than a source of harm. After all, the problem does not lie in the technology itself, but in how we choose to use it.`},
