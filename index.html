    {title:'環保週活動', audio:"Hi everyone, this is the Environmental Club. Next week is our Green Week! From Monday to Friday, we have arranged different activities. On Monday, there is a recycling workshop in the hall after school. On Wednesday, we will have a clothes swap party where you can exchange old clothes. On Friday, we will plant trees in the school garden. Also, remember to bring your own water bottle every day to save plastic. See you there!",
     qs:[
       {q:'星期一有咩活動？', opts:['植樹活動','回收工作坊','換衫派對'], a:1},
       {q:'換衫派對喺星期幾？', opts:['星期二','星期三','星期五'], a:1},
       {q:'每日記得帶咩？', opts:['水樽','環保袋','午餐盒'], a:0}
     ]}
  ],
  playPassage(i){ const p=Listening.PASSAGES[i]; Listening.speak(p.audio,'en-US',0.85); },
  passage(i){
    const p=Listening.PASSAGES[i];
    const v=Utils.$('#view-listening');
    v.innerHTML=`
      <button class="btn ghost sm" style="margin-top:10px" onclick="Listening.enter()">← 返回</button>
      <div class="topic-hero" style="margin-top:10px"><div class="tq">${p.title}</div><div class="tg">聆聽理解 · ${p.qs.length} 題</div></div>
      <div class="card" style="margin-bottom:12px;text-align:center">
        <button class="btn" onclick="Listening.playPassage(0)">🔊 播放錄音</button>
        <button class="btn sm ghost" style="margin-left:8px" onclick="Listening.stop()">⏹ 停止</button>
        <div style="font-size:11px;color:var(--sub);margin-top:8px">建議先聽一次再做題，可以重播</div>
      </div>
      <div class="section-title"><span class="dot"></span>答題</div>
      <div id="listenQs"></div>
      <button class="btn" style="width:100%;margin-bottom:20px" onclick="Listening.check()">✅ 提交答案</button>
      <div id="listenResult"></div>
    `;
    Listening._cur={type:'passage', p:p, ans:new Array(p.qs.length).fill(-1)};
    const qb=Utils.$('#listenQs');
    qb.innerHTML=p.qs.map((q,qi)=>`
      <div class="card" style="margin-bottom:12px">
        <div class="st-t">${qi+1}. ${q.q}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${q.opts.map((o,oi)=>'<button class="btn sm ghost" style="text-align:left;justify-content:flex-start" onclick="Listening.choose('+qi+','+oi+',this)">'+o+'</button>').join('')}</div>
      </div>`).join('');
  },
  choose(qi,oi,el){
    if(!Listening._cur) return;
    Listening._cur.ans[qi]=oi;
    const card=Utils.$$('#listenQs .card')[qi];
    Utils.$$(card).forEach(b=>b.classList.remove('brand'));
    el.classList.add('brand');
  },
  check(){
    const c=Listening._cur; if(!c) return;
    const total=c.p.qs.length;
    let score=0;
    const detail=c.p.qs.map((q,qi)=>{
      const ok=c.ans[qi]===q.a;
      if(ok) score++;
      return `<div style="font-size:13px;padding:5px 0;color:${ok?'var(--ok)':'var(--err)'}">${ok?'✅':'❌'} ${q.q}${ok?'':'（答案：'+q.opts[q.a]+'）'}</div>`;
    }).join('');
    const pct=Math.round(score/total*100);
    const r=Utils.$('#listenResult');
    r.innerHTML=`<div class="card" style="background:${pct>=80?'var(--bg-soft)':'var(--bg-soft)'}"><div style="font-size:18px;font-weight:800">得分 ${score}/${total}（${pct}%）</div><div style="font-size:12px;color:var(--sub)">${pct>=80?'🎉 好犀利，Paper 3 高分冇難度':pct>=60?'👍 唔錯，重播再聽鞏固':pct>=40?'💪 有進步空間，建議睇稿再聽':'📖 多啲聽英文，慢慢進步'}</div></div><div class="card" style="margin-top:8px">${detail}</div>`;
    Utils.toast('已提交');
  },
  /* ---- Data File 綜合 ---- */
  DATASETS:[
    {title:'English Fun Fair 活動策劃', scenario:'你係學生會幹事，要根據錄音同資料整理一份活動計劃書。', audio:"Hello Amy, this is Mr Lee. I have received the proposal for the English Fun Fair. The venue and the budget have been approved. The fair will be held on the twenty-eighth of March in the school playground. You have a budget of five thousand dollars for ten game booths. Please confirm the number of student helpers with the teachers before the fifteenth of March. Also, remember to prepare rain backup: if it rains, move the fair to the covered basketball court.",
     data:[['活動名稱','English Fun Fair'],['日期','3 月 28 日'],['地點','學校操場（雨天：有蓋籃球場）'],['攤位數量','10 個'],['預算','$5,000'],['確認義工人數限期','3 月 15 日前']],
     qs:[
       {q:'活動地點係邊？', opts:['學校操場','禮堂','有蓋籃球場'], a:0},
       {q:'預算係幾多？', opts:['$3,000','$5,000','$10,000'], a:1},
       {q:'下雨天嘅後備安排係咩？', opts:['取消活動','移去有蓋籃球場','改期'], a:1}
     ]},
    {title:'義工服務安排', scenario:'你係活動統籌，要整理義工服務嘅安排。', audio:"Welcome to the volunteer team! Our community service day will be on the fifth of April, from two to five in the afternoon. We will visit the elderly home in Sham Shui Po. There are two groups: the cleaning group and the conversation group. The cleaning group will tidy the common areas, and the conversation group will chat with the elderly. Please wear comfortable clothes and bring your own water bottle. The bus will leave the school gate at one fifteen.",
     data:[['服務日期','4 月 5 日'],['時間','下午 2:00 - 5:00'],['地點','深水埗長者中心'],['分組','清潔組 / 傾偈組'],['集合時間','下午 1:15 學校門口'],['自備物品','水樽']],
     qs:[
       {q:'義工服務喺邊日？', opts:['4 月 5 日','4 月 15 日','5 月 4 日'], a:0},
       {q:'有邊兩個組？', opts:['清潔組同烹飪組','清潔組同傾偈組','傾偈組同教書組'], a:1},
       {q:'旅遊巴幾點開？', opts:['1:15','2:00','3:00'], a:0}
     ]}
  ],
  playDataset(i){ const d=Listening.DATASETS[i]; Listening.speak(d.audio,'en-US',0.85); },
  dataset(i){
    const d=Listening.DATASETS[i];
    const v=Utils.$('#view-listening');
    v.innerHTML=`
      <button class="btn ghost sm" style="margin-top:10px" onclick="Listening.enter()">← 返回</button>
      <div class="topic-hero" style="margin-top:10px"><div class="tq">${d.title}</div><div class="tg">Data File 綜合能力</div></div>
      <div class="card" style="margin-bottom:12px">
        <div class="st-t">📋 情境</div>
        <div class="st-d" style="line-height:1.7">${d.scenario}</div>
      </div>
      <div class="card" style="margin-bottom:12px;text-align:center">
        <button class="btn" onclick="Listening.playDataset(0)">🔊 播放錄音</button>
        <button class="btn sm ghost" style="margin-left:8px" onclick="Listening.stop()">⏹ 停止</button>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="st-t">🗂️ Data File 資料</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${d.data.map(r=>'<div style="background:var(--bg-soft);border-radius:8px;padding:8px;font-size:12px"><div style="font-weight:700;color:var(--sub)">'+r[0]+'</div><div style="margin-top:2px">'+r[1]+'</div></div>').join('')}</div>
        <div style="font-size:11px;color:var(--faint);margin-top:8px">Paper 3 考你同時睇資料 + 聽錄音，整合資訊作答</div>
      </div>
      <div class="section-title"><span class="dot"></span>答題</div>
      <div id="listenQs"></div>
      <button class="btn" style="width:100%;margin-bottom:20px" onclick="Listening.check()">✅ 提交答案</button>
      <div id="listenResult"></div>
    `;
    Listening._cur={type:'dataset', p:d, ans:new Array(d.qs.length).fill(-1)};
    const qb=Utils.$('#listenQs');
    qb.innerHTML=d.qs.map((q,qi)=>`
      <div class="card" style="margin-bottom:12px">
        <div class="st-t">${qi+1}. ${q.q}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${q.opts.map((o,oi)=>'<button class="btn sm ghost" style="text-align:left;justify-content:flex-start" onclick="Listening.choose('+qi+','+oi+',this)">'+o+'</button>').join('')}</div>
      </div>`).join('');
  }
};

window.Speaking=Speaking; window.Debate=Debate; window.ReadingTool=ReadingTool; window.Listening=Listening;

window.LvTest=LvTest;
App.boot();
</script>
