  /* ---------- V5.11.6 模擬考場 ---------- */
  examStart(){
    const mins=prompt('考場時限（分鐘）：DSE Paper 2 建議 120', '120');
    const m=parseInt(mins,10);
    if(!m||m<5||m>240){ Utils.toast('時限需為 5-240 分鐘'); return; }
    EssayGrader.exam={active:true, minutes:m, left:m*60, timer:null, goal:500};
    if(!EssayGrader.topic) EssayGrader.topic=EssayGrader.prompts[0];
    const body=document.body;
    const ov=document.createElement('div');
    ov.className='exam-overlay'; ov.id='examOverlay';
    ov.innerHTML=`
      <div class="exam-bar">
        <button class="btn danger sm" onclick="EssayGrader.examCancel()">✕ 退出</button>
        <div class="exam-timer" id="examTimer">${EssayGrader._fmt(EssayGrader.exam.left)}</div>
        <div style="flex:1"></div>
        <div class="exam-count" id="examCount">0 字</div>
        <button class="btn sm" onclick="EssayGrader.examSubmit(true)">📮 交卷</button>
      </div>
      <div class="exam-area">
        <div class="exam-topic">📌 ${Utils.esc(EssayGrader.topic)}</div>
        <textarea class="exam-ta" id="examTa" placeholder="喺度寫作文（DSE Paper 2 建議約 500 字）…" autofocus>${Utils.esc(EssayGrader.text)}</textarea>
      </div>
      <div class="exam-foot">
        <div style="font-size:12px;color:var(--faint);flex-shrink:0">目標 ${EssayGrader.exam.goal} 字</div>
        <div class="exam-progress"><div class="exam-fill" id="examFill" style="width:0%"></div></div>
        <div style="font-size:12px;color:var(--faint);flex-shrink:0" id="examPct">0%</div>
      </div>
    `;
    body.appendChild(ov);
    if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(()=>{}); }
    const ta=Utils.$('#examTa');
    ta.focus();
    ta.addEventListener('input',()=>{ EssayGrader.text=ta.value; EssayGrader._examTickUI(); });
    EssayGrader.exam.timer=setInterval(()=>{
      EssayGrader.exam.left--;
      if(EssayGrader.exam.left<=0){ EssayGrader.examSubmit(true); return; }
      EssayGrader._examTickUI();
    },1000);
    EssayGrader._examTickUI();
  },
  _examTickUI(){
    const e=EssayGrader.exam; if(!e||!e.active) return;
    const tEl=Utils.$('#examTimer'); if(tEl){ tEl.textContent=EssayGrader._fmt(e.left); tEl.classList.toggle('warn', e.left<=300); }
    const ta=Utils.$('#examTa'); if(!ta) return;
    const n=Utils.wordCount(ta.value);
    const cEl=Utils.$('#examCount'); if(cEl) cEl.textContent=n+' 字';
    const pct=Math.min(100, Math.round(n/e.goal*100));
    const fEl=Utils.$('#examFill'); if(fEl) fEl.style.width=pct+'%';
    const pEl=Utils.$('#examPct'); if(pEl) pEl.textContent=pct+'%';
  },
  _fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); },
  examCancel(){
    if(!confirm('確定退出考場？未交卷內容仍會保留喺輸入框。')) return;
    if(EssayGrader.exam.timer) clearInterval(EssayGrader.exam.timer);
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    const ov=Utils.$('#examOverlay'); if(ov) ov.remove();
    EssayGrader.exam={active:false, minutes:120, left:0, timer:null, goal:500};
    Utils.toast('已退出考場');
  },
  examSubmit(auto){
    const ta=Utils.$('#examTa');
    if(ta) EssayGrader.text=ta.value;
    const n=Utils.wordCount(EssayGrader.text);
    if(n<30){ Utils.toast('作文太短（至少 30 字），寫多少少先交卷啦'); return; }
    if(!auto && !confirm('確定交卷？交卷後會即時評分。')) return;
    if(EssayGrader.exam.timer) clearInterval(EssayGrader.exam.timer);
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    const ov=Utils.$('#examOverlay'); if(ov) ov.remove();
    EssayGrader.exam={active:false, minutes:120, left:0, timer:null, goal:500};
    EssayGrader.render();
    Utils.toast('📮 已交卷，評分緊…');
    EssayGrader.grade();
  },
  async grade(){
    const text=Utils.$('#essayText').value.trim();
    EssayGrader.text=text;
    if(Utils.wordCount(text)<30){ Utils.toast('作文太短，至少 30 字先評到分'); return; }
    const cfg=Store.state.essay;
    EssayGrader.loading=true;
    EssayGrader._renderLoading();
    try{
      if(cfg.useApi){
        if(!cfg.apiKey){ throw new Error('未設定 API Key，請到設置填入'); }
        EssayGrader.result=await EssayGrader.analyzeAPI(text);
      }else{
        await new Promise(r=>setTimeout(r,350));
        EssayGrader.result=EssayGrader.analyzeLocal(text);
      }
    }catch(e){
      Utils.toast('評分失敗：'+e.message);
      EssayGrader.result=null;
    }
    EssayGrader.loading=false;
    EssayGrader.render();
    if(EssayGrader.result){
      Store.state.essayCount=(Store.state.essayCount||0)+1; Store.persist();
      const v=Utils.$('#view-essay'); v.scrollTop=v.scrollHeight;
    }
  },
  _renderLoading(){
    Utils.$('#view-essay').insertAdjacentHTML('beforeend',`<div class="grade-loading"><div class="spinner"></div><div>AI 分析緊作文…</div></div>`);
  },
  _resultHtml(){

    if(!r) return '';
    const totalRing=`<svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs><circle class="ring-bg" cx="48" cy="48" r="40"/><circle class="ring-fill" cx="48" cy="48" r="40" stroke-dasharray="${2*Math.PI*40}" stroke-dashoffset="${2*Math.PI*40*(1-r.total/30)}"/></svg><div class="ring-num">${r.total}</div><div class="ring-den">/ 30</div>`;
    const dim=(name,score,note)=>`<div class="dim-bar"><div class="dim-head"><span class="dim-name">${name}</span><span class="dim-score">${score} / 10</span></div><div class="dim-track"><div class="dim-fill" style="width:${score*10}%"></div></div>${note?`<div class="dim-note">${note}</div>`:''}</div>`;
    let detail='';
    if(r.mode==='local'){
      const m=r.stats;
      detail=`
        <div class="grade-section"><h4><span class="gs-ic">📏</span>文章數據</h4>
          <div class="highlight">字數 ${m.wordCount} · ${m.sentCount} 句 · ${m.paraCount} 段 · 平均句長 ${m.avgLen} 詞${m.connCount?` · 連接詞 ${m.connCount} 次（${m.connUniq} 種）`:''}</div>
        </div>`;
    }
    const strengths=r.feedback&&r.feedback.strengths||r.strengths||[];
    const weaknesses=r.feedback&&r.feedback.weaknesses||r.improvements||[];

    return `<div class="grade-result">
      <div class="score-hero">
        <div class="score-ring">${totalRing}</div>

          <div class="score-lv">${r.level.lv} <span class="lv-tag" style="background:${r.level.color};color:#fff">${r.level.tag}</span></div>
          <div class="score-meta">${r.mode==='api'?'🤖 AI 深度評分':'✍️ 離線規則評分'}<br>Content ${r.content} / Organisation ${r.organisation} / Language ${r.language}</div>
        </div>
      </div>
      <div class="score-bars">
        ${dim('內容 Content',r.content,r.mode==='local'?EssayGrader._contentNote(r.stats):'')}
        ${dim('組織 Organisation',r.organisation,r.mode==='local'?EssayGrader._orgNote(r.stats):'')}
        ${dim('語言 Language',r.language,r.mode==='local'?EssayGrader._langNote(r.stats):'')}
      </div>
      ${r.comment?`<div class="grade-section"><h4><span class="gs-ic">💬</span>總評</h4><div class="highlight">${Utils.esc(r.comment)}</div></div>`:''}
      ${detail}

      <div class="grade-section"><h4><span class="gs-ic">⚠️</span>需要改善</h4><ul>${weaknesses.map(s=>`<li class="bad">${Utils.esc(s)}</li>`).join('')||'<li>整體表現理想，繼續保持</li>'}</ul></div>
      ${tips.length?`<div class="grade-section"><h4><span class="gs-ic">💡</span>提升建議</h4><ul>${tips.map(s=>`<li>${Utils.esc(s)}</li>`).join('')}</ul></div>`:''}
      ${r.mode==='local'&&r.stats&&r.stats.upgrades&&r.stats.upgrades.length?(()=>{

        return `<div class="grade-section"><h4><span class="gs-ic">⬆️</span>詞彙升級建議（V5.11.6）</h4>
          <div style="font-size:12px;color:var(--sub);margin-bottom:8px">將平淡詞換成高分詞，即時提升 Language 分：</div>
          <div style="display:flex;flex-direction:column;gap:8px">${r.stats.upgrades.map(u=>`
            <div style="background:var(--bg-soft);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-weight:800;color:var(--err);font-size:13px;text-decoration:line-through">${u.t}</span><span style="color:var(--faint);font-size:11px">×${u.n} · ${typeName[u.type]||''}</span>
              <span style="color:var(--faint)">→</span>
              <span style="font-weight:800;color:var(--ok);font-size:13px">${u.up.join('、')}</span>
            </div>`).join('')}
          </div>
        </div>`;})():''}
      <button class="btn ghost" style="width:100%;margin-bottom:20px" onclick="EssayGrader.result=null;EssayGrader.render()">評下一份</button>
    </div>`;
  },
  _contentNote(m){
    const notes=[];
    if(m.wordCount<300) notes.push(`字數偏少（${m.wordCount} 字），內容分受影響`);
    else if(m.wordCount>=450) notes.push(`字數充足（${m.wordCount} 字）`);
    if(m.paraCount<3) notes.push(`段落偏少（${m.paraCount} 段）`);
    return notes.join('；');
  },
  _orgNote(m){
    const notes=[];
    if(m.connCount<3) notes.push(`連接詞少（${m.connCount} 次）`);
    else notes.push(`連接詞 ${m.connCount} 次（${m.connUniq} 種）`);
    return notes.join('；');
  },
  _langNote(m){
    const notes=[];
    notes.push(`高階詞 ${m.advRatio}%${m.advancedHits.length?`（${m.advancedHits.map(x=>x.phrase).join('、')}）`:''}`);
    if(m.grammarIssues.length) notes.push(`文法問題 ${m.grammarIssues.length} 處`);
    if(m.attitudeHits){
      const attAll=[...m.attitudeHits.pos,...m.attitudeHits.neg];
      notes.push(`語氣態度詞 ${attAll.length} 個${attAll.length?`（${attAll.slice(0,4).map(x=>x.t).join('、')}…）`:''}`);
    }
    return notes.join('；');
  },
  renderSettings(){

/* =====================================================================
 * Level 測試（精簡版）
 * ===================================================================== */
const LvTest = {
  qs:[], idx:0, score:0, parts:{a:0,b:0,c:0}, done:false, score100:0,
  start(){
    const byStar=s=>Data.raw.filter(w=>w.stars===s);
    const pick=(pool,n)=>Utils.shuffle(pool).slice(0,n);
    const fill=(arr,n)=>{ while(arr.length<n){ const alt=Utils.shuffle(Data.raw).find(w=>!arr.includes(w)); if(!alt)break; arr.push(alt); } return arr; };
    // 分層抽題：初階 3 題(1-2星) + 中階 5 題(3-4星) + 進階 4 題(5星)
    let easy=[...pick(byStar(1),2),...pick(byStar(2),1)];
    let mid=[...pick(byStar(3),3),...pick(byStar(4),2)];
    let hard=pick(byStar(5),4);
    easy=fill(easy,3); mid=fill(mid,5); hard=fill(hard,4);
    const pool=[...easy.map(w=>({w,tier:0})),...mid.map(w=>({w,tier:1})),...hard.map(w=>({w,tier:2}))];
    LvTest.qs=Utils.shuffle(pool).map(({w,tier})=>{
      const rev=tier===2?true:(Math.random()<0.5);
      const opts=Utils.shuffle(Data.raw.filter(x=>x.id!==w.id&&Math.abs(x.stars-w.stars)<=1)).slice(0,3);
      return {w, opts:Utils.shuffle([w,...opts]), tier, rev};
    });
    LvTest.idx=0; LvTest.score=0; LvTest.done=false;
    LvTest.parts={a:0,b:0,c:0};
    LvTest.render();
  },
  baseScore(tier){ return tier===0?5:tier===1?8:12; },
  tierName(t){ return t===0?'初階':t===1?'中階':'進階'; },
  render(){
    const body=Utils.$('#lvtestBody');
    if(LvTest.done){
      const maxRaw=LvTest.qs.reduce((s,q)=>s+LvTest.baseScore(q.tier),0);
      LvTest.score100=Math.round(LvTest.score/maxRaw*100);
      const lv=Utils.lvFromScore(LvTest.score100);
      Store.state.lvTest={ score:LvTest.score100, lv, ts:Date.now(), raw:LvTest.score, maxRaw, parts:LvTest.parts };
      Store.persist();
      const partHtml=[['初階',LvTest.parts.a,3],['中階',LvTest.parts.b,5],['進階',LvTest.parts.c,4]].map(([nm,got,n],i)=>{
        const pct=Math.round(got/(n*LvTest.baseScore(i))*100);
        return `<div style="display:flex;justify-content:space-between;font-size:12px;margin:6px 0"><span>${nm}（${got}/${n*LvTest.baseScore(i)}）</span><span>${pct}%</span></div><div style="height:6px;background:#E5E7EB;border-radius:3px;margin-bottom:8px"><div style="height:6px;width:${pct}%;background:${pct>=70?'#22C55E':pct>=50?'#F59E0B':'#EF4444'};border-radius:3px"></div></div>`;
      }).join('');
      const tip=LvTest.score100>=90?'穩陣 5** 水平，繼續保持！':LvTest.score100>=82?'達 5*，衝 5** 要再熟啲高階詞':LvTest.score100>=74?'達 5 級，5* 需要強化 Part 5A/5B 進階詞':LvTest.score100>=64?'達 4 級，建議每日加量背高階詞':LvTest.score100>=52?'達 3 級，需要系統補底初中階詞':LvTest.score100>=40?'達 2 級，建議先鞏固 Part 1 基礎詞':'屬 1 級，建議由基礎詞開始逐步建立詞彙庫';
      body.innerHTML=`<div class="empty"><div class="e-icon">${LvTest.score100>=74?'🏆':'📚'}</div><div style="font-size:22px;font-weight:800;margin-bottom:4px">${LvTest.score100} / 100</div><div class="chip brand" style="margin-bottom:16px">DSE Level：${lv}</div><div class="card" style="width:100%;text-align:left;margin-bottom:12px">${partHtml}</div><div class="chip" style="margin-bottom:16px;background:#E8F5E9;color:#2E7D32">✅ DSE Level 已更新</div><div style="font-size:13px;color:#666;margin-bottom:16px;max-width:300px;line-height:1.6">${tip}</div><button class="btn" onclick="LvTest.start()">再測一次</button></div>`;
      return;
    }
    const q=LvTest.qs[LvTest.idx];
    body.innerHTML=`
      <div class="quiz-progress"><div class="quiz-fill" style="width:${LvTest.idx/LvTest.qs.length*100}%"></div></div>
      <div class="quiz-meta"><span>${LvTest.idx+1} / ${LvTest.qs.length}</span><span class="chip sm" style="background:${q.tier===0?'#E3F2FD;color:#1565C0':q.tier===1?'#FFF3E0;color:#E65100':'#FCE4EC;color:#C62828'}">${LvTest.tierName(q.tier)}</span></div>
      <div class="quiz-card"><div class="quiz-q">${q.rev?`${Utils.esc(q.w.phrase)} <span style="font-size:12px;color:#999">（揀正確意思）</span>`:Utils.esc(q.w.meaning)}</div>
        <div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="LvTest.pick(${i})"><span class="qk">${'ABCD'[i]}</span><span>${Utils.esc(q.rev?o.meaning:o.phrase)}</span></button>`).join('')}</div>
      </div>`;
  },
  pick(i){
    const q=LvTest.qs[LvTest.idx];
    const ok=q.opts[i].id===q.w.id;
    if(ok){
      LvTest.score+=LvTest.baseScore(q.tier);
      LvTest.parts[q.tier===0?'a':q.tier===1?'b':'c']+=LvTest.baseScore(q.tier);
    }
    LvTest.idx++;
    if(LvTest.idx>=LvTest.qs.length){ LvTest.done=true; }
    LvTest.render();
  }
};

  _listen(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ Utils.toast('瀏覽器唔支援語音識別'); return; }
    const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
    Utils.toast('🎙️ 請朗讀詞彙...');
    r.onresult=e=>{
      const said=e.results[0][0].transcript;
      const w=Speaking._pw;
      const score=Speaking._score(w.phrase, said);
      const el=Utils.$('#spkResult');
      el.innerHTML=`<div class="card" style="text-align:center">
        <div style="font-size:32px;font-weight:800;color:${score>=80?'var(--ok)':score>=50?'#f59e0b':'var(--err)'}">${score} 分</div>
        <div style="font-size:13px;color:var(--sub);margin-top:4px">辨識到：「${Utils.esc(said)}」</div>
        <div style="font-size:13px;margin-top:4px">目標：「${Utils.esc(w.phrase)}」</div>
        <div style="font-size:12px;color:var(--sub);margin-top:8px">${score>=80?'🎉 發音好標準':score>=50?'👍 唔錯，留意尾音同重音':'💪 再聽一次正確發音，慢慢讀'}</div>
      </div>`;
    };
    r.onerror=()=>Utils.toast('未能辨識，請再試');
    r.start();

  _score(a,b){
    const A=a.toLowerCase().replace(/[^a-z ]/g,'').trim();
    const B=b.toLowerCase().replace(/[^a-z ]/g,'').trim();
    if(A===B) return 100;
    const d=Speaking._lev(A,B);
    return Math.max(0, Math.round((1-d/Math.max(A.length,B.length,1))*100));
  },
  _lev(a,b){
    const m=a.length, n=b.length;
    const dp=Array.from({length:m+1},(_,i)=>{ const r=new Array(n+1).fill(0); r[0]=i; return r; });
    for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return dp[m][n];
  },
  _iv:null,
  timer(sec){

      const m=Math.floor(left/60), s=left%60;

      el.classList.toggle('warn', left<=10);
      if(left<=0){ Speaking.stop(); }
      left--;
    };
    tick();
    Speaking._iv=setInterval(tick,1000);
  },
  stop(){ if(Speaking._iv){ clearInterval(Speaking._iv); Speaking._iv=null; } }

      body.innerHTML=ReadingTool.KWS.map((k,i)=>'<div class="kw-row" style="margin-bottom:0"><div class="kw-tag" onclick="ReadingTool.open(\'kws\','+i+')">🔑 '+k.t+'</div></div>').join('') + '<div class="dse-tip" style="margin-top:12px">撳上面嘅關鍵詞類別，睇定位策略同例子</div>';
    }
  },
  open(cat,i){
    const v=Utils.$('#view-reading');
    if(cat==='kws'){
      const k=ReadingTool.KWS[i];
      v.innerHTML=`
        <button class="btn ghost sm" style="margin-top:10px" onclick="ReadingTool.enter()">← 返回</button>
        <div class="topic-hero" style="margin-top:10px"><div class="tq">🔑 ${k.t}</div><div class="tg">關鍵詞定位</div></div>
        <div class="kw-detail"><div class="kd-d">${k.detail}</div></div>

      return;

    const list=cat==='genres'?ReadingTool.GENRES:ReadingTool.QTYPES;
    const item=list[i];
    const stepsHtml=item.steps.map((s,si)=>'<div class="step-item"><div class="st-t"><span class="no">'+(si+1)+'</span>'+(cat==='genres'?('📰 '+item.t.split(' ')[0]):('❓ '+item.t.split(' ')[0]))+'</div><div class="st-d">'+s+'</div></div>').join('');

      <button class="btn ghost sm" style="margin-top:10px" onclick="ReadingTool.enter()">← 返回</button>

    `;
  }

    { t: "pave the way for", m: "為…鋪路", syn: "lay the groundwork for / open the door to", use: "說明為後續發展創造條件", reg: "formal", ex: ["The trial scheme paved the way for city-wide recycling.", "Basic research paves the way for future inventions.", "The agreement paves the way for closer trade ties."] },
    { t: "bridge the gap", m: "縮小差距；彌合分歧", syn: "narrow the gap / close the divide", use: "解決資源/能力落差", reg: "formal", ex: ["Community programmes bridge the gap between schools and families.", "Free Wi-Fi helps bridge the gap between urban and rural areas.", "Internships bridge the gap between study and work."] },

const Listening={
  _cur:null,
  enter(){

      <div class="x-toolbar"><div class="x-tab on"><span class="ic">🎧</span>聆聽綜合</div><div class="x-tab" onclick="App.go('speaking')"><span class="ic">🗣️</span>口語</div><div class="x-tab" onclick="App.go('reading')"><span class="ic">📖</span>閱讀</div></div>
      <div class="section-title"><span class="dot"></span>Paper 3 聆聽及綜合能力（佔 30%）</div>
      <div class="quick">
        <div class="qb" onclick="Listening.vocab()"><span class="ic">🔊</span><span class="t">聆聽詞彙</span><span class="d">TTS 發音訓練</span></div>

    `;
  },
  speak(text,lang,rate){
    try{
      if(!('speechSynthesis' in window)){ Utils.toast('瀏覽器唔支援語音'); return; }
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang||'en-US'; u.rate=rate||0.85; u.pitch=1;
      speechSynthesis.speak(u);
    }catch(e){ Utils.toast('語音播放失敗'); }
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} },
  /* ---- Paper 3B 整合寫作片語 ---- */
  _p3bGroup:null,
  p3b(){
    Listening._p3bGroup=null;
    const v=Utils.$('#view-listening');
    const regBadge=r=>`<span style="display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:2px;background:${r==='formal'?'#EEF2FF;color:#4F46E5':r==='informal'?'#FEF3C7;color:#B45309':'#ECFDF5;color:#047857'};border:1px solid ${r==='formal'?'#C7D2FE':r==='informal'?'#FDE68A':'#A7F3D0'}">${r==='formal'?'FORMAL':r==='informal'?'INFORMAL':'SEMI-FORMAL'}</span>`;
    v.innerHTML=`
      <div class="x-toolbar"><div class="x-tab on" onclick="Listening.enter()"><span class="ic">🎧</span>聆聽綜合</div><div class="x-tab" onclick="App.go('speaking')"><span class="ic">🗣️</span>口語</div><div class="x-tab" onclick="App.go('reading')"><span class="ic">📖</span>閱讀</div></div>

      <div class="section-title" style="margin-top:12px"><span class="dot"></span>Paper 3B 整合寫作片語</div>

      <div class="wt-grid">
        ${P3B_PICKS.map((g,i)=>`<div class="wt-fmt" onclick="Listening._p3bGroup=${i};Listening.p3b()"><div class="t">${Utils.esc(g.g)}</div><div class="p">${g.items.length} 條片語</div></div>`).join('')}
      </div>
    `;
    if(Listening._p3bGroup!==null){
      const g=P3B_PICKS[Listening._p3bGroup];
      if(g){
        const list=document.createElement('div');
        list.style.marginTop='14px';
        list.innerHTML=g.items.map(p=>`
          <div class="wt-group" style="margin-bottom:14px">
            <div class="wt-phrase" style="align-items:flex-start">
              <div style="flex:1;min-width:0">
                <div class="txt">${Utils.esc(p.t)}${regBadge(p.reg)}</div>
                <div class="mean" style="margin-top:2px">${Utils.esc(p.m)}</div>
                <div style="font-size:11.5px;line-height:1.6;margin-top:6px;border-top:1px dashed var(--border);padding-top:6px">
                  <div style="color:var(--sub)">🔁 <b>同義替換：</b>${Utils.esc(p.syn)}</div>
                  <div style="color:var(--sub);margin-top:3px">📍 <b>適用場景：</b>${Utils.esc(p.use)}</div>
                  <div style="color:var(--sub);margin-top:6px">✏️ <b>例句：</b></div>
                  ${(p.ex||[]).map(s=>`<div style="background:var(--bg);border-radius:8px;padding:6px 8px;margin-top:4px;font-size:11.5px;color:var(--ink);line-height:1.55">${Utils.esc(s)}</div>`).join('')}
                </div>
              </div>
              <button class="wt-copy" onclick="Listening.copy(this,'${Utils.esc(p.t).replace(/'/g,"\'")}')">複製</button>
            </div>
          </div>`).join('');
        v.appendChild(list);
      }
    }
  },
  copy(btn,txt){
    const done=()=>{ if(btn){ btn.textContent='已複製 ✓'; setTimeout(()=>{ btn.textContent='複製'; },1200); } };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>{ Utils.toast('複製失敗'); }); }
    else{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ Utils.toast('複製失敗'); } document.body.removeChild(ta); }
  },
  /* ---- 聆聽詞彙 ---- */
  vocab(){
    const v=Utils.$('#view-listening');
    const cats=[...new Set(Data.raw.map(w=>w.category))];
    v.innerHTML=`
      <button class="btn ghost sm" style="margin-top:10px" onclick="Listening.enter()">← 返回</button>
      <div class="section-title"><span class="dot"></span>揀分類聆聽詞彙</div>
      <div class="card" style="margin-bottom:12px">${cats.map(c=>'<button class="btn sm ghost" style="margin:3px" onclick="Listening.vocabList(\''+c+'\')">'+c+'</button>').join('')}</div>
      <div class="dse-tip" style="font-size:11px;color:var(--sub);background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:11px;line-height:1.6">🔊 撳詞彙即聽發音（英文 + 中文解釋）</div>
    `;
  },
  vocabList(cat){
    const words=Data.raw.filter(w=>w.category===cat).slice(0,40);
    const v=Utils.$('#view-listening');
    v.innerHTML=`
      <button class="btn ghost sm" style="margin-top:10px" onclick="Listening.vocab()">← 返回分類</button>
      <div class="section-title"><span class="dot"></span>${cat}（顯示 ${words.length} 詞）</div>
      <div class="card" style="margin-bottom:12px">${words.map(w=>'<div class="list-item" onclick="Listening.word(\''+w.id+'\')"><div class="li-main"><div class="li-ph">'+Utils.esc(w.phrase)+' <span class="pos-tag">'+Utils.esc(w.pos||'')+'</span></div><div class="li-mean">'+Utils.esc(w.meaning)+'</div></div><div class="li-fav" style="font-size:15px">🔊</div></div>').join('')}</div>
    `;
  },
  word(id){
    const w=Data.get(id); if(!w) return;
    Listening.stop();
    Listening.speak(w.phrase,'en-US',0.8);
    setTimeout(()=>Listening.speak(w.meaning,'zh-HK',0.9), 700);
    Utils.toast('🔊 播放中');
  },
  /* ---- 聆聽理解 ---- */
  PASSAGES:[
    {title:'Open Day 廣播', audio:"Good morning, everyone. This is an announcement from the principal's office. Our school open day will be held on Saturday, the twenty-eighth of March, from ten in the morning to four in the afternoon. There will be guided tours, science demonstrations and a book fair. Students who volunteer will receive a certificate and ten community service hours. Interested students should sign up at the general office before Friday. Thank you for your attention.",
     qs:[
       {q:'Open Day 喺幾時舉行？', opts:['3 月 28 日','3 月 25 日','4 月 28 日'], a:0},
       {q:'活動包括以下邊樣？', opts:['科學示範','音樂會','烹飪比賽'], a:0},
       {q:'義工學生可以獲得咩？', opts:['獎金同證書','證書同 10 小時社區服務','免費午餐同證書'], a:1},
       {q:'點樣報名做義工？', opts:['網上報名','去教務處登記','搵班主任'], a:1}
     ]},
    {title:'環保週活動', audio:"Hi everyone, this is the Environmental Club. Next week is our Green Week! From Monday to Friday, we have arranged different activities. On Monday, there is a recycling workshop in the hall after school. On Wednesday, we will have a clothes swap party where you can exchange old clothes. On Friday, we will plant trees in the school garden. Also, remember to bring your own water bottle every day to save plastic. See you there!",
     qs:[
       {q:'星期一有咩活動？', opts:['植樹活動','回收工作坊','換衫派對'], a:1},
       {q:'換衫派對喺星期幾？', opts:['星期二','星期三','星期五'], a:1},
       {q:'每日記得帶咩？', opts:['水樽','環保袋','午餐盒'], a:0}
     ]}
  ],
  playPassage(i){ const p=Listening.PASSAGES[i]; Listening.speak(p.audio,'en-US',0.85); },
  passage(i){
    const p=Listening.PASSAGES[i];
    const v=Utils.$('#view-listening');
    v.innerHTML=`
      <button class="btn ghost sm" style="margin-top:10px" onclick="Listening.enter()">← 返回</button>
      <div class="topic-hero" style="margin-top:10px"><div class="tq">${p.title}</div><div class="tg">聆聽理解 · ${p.qs.length} 題</div></div>
      <div class="card" style="margin-bottom:12px;text-align:center">
        <button class="btn" onclick="Listening.playPassage(0)">🔊 播放錄音</button>
        <button class="btn sm ghost" style="margin-left:8px" onclick="Listening.stop()">⏹ 停止</button>
        <div style="font-size:11px;color:var(--sub);margin-top:8px">建議先聽一次再做題，可以重播</div>
      </div>
      <div class="section-title"><span class="dot"></span>答題</div>
      <div id="listenQs"></div>
      <button class="btn" style="width:100%;margin-bottom:20px" onclick="Listening.check()">✅ 提交答案</button>
      <div id="listenResult"></div>
    `;
    Listening._cur={type:'passage', p:p, ans:new Array(p.qs.length).fill(-1)};
    const qb=Utils.$('#listenQs');
    qb.innerHTML=p.qs.map((q,qi)=>`
      <div class="card" style="margin-bottom:12px">
        <div class="st-t">${qi+1}. ${q.q}</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${q.opts.map((o,oi)=>'<button class="btn sm ghost" style="text-align:left;justify-content:flex-start" onclick="Listening.choose('+qi+','+oi+',this)">'+o+'</button>').join('')}</div>
      </div>`).join('');
  },
  choose(qi,oi,el){
    if(!Listening._cur) return;
    Listening._cur.ans[qi]=oi;
    const card=Utils.$$('#listenQs .card')[qi];
    Utils.$$(card).forEach(b=>b.classList.remove('brand'));
    el.classList.add('brand');
  },
  check(){
    const c=Listening._cur; if(!c) return;
    const total=c.p.qs.length;
    let score=0;
    const detail=c.p.qs.map((q,qi)=>{
      const ok=c.ans[qi]===q.a;
      if(ok) score++;
      return `<div style="font-size:13px;padding:5px 0;color:${ok?'var(--ok)':'var(--err)'}">${ok?'✅':'❌'} ${q.q}${ok?'':'（答案：'+q.opts[q.a]+'）'}</div>`;
    }).join('');
    const pct=Math.round(score/total*100);
    const r=Utils.$('#listenResult');
    r.innerHTML=`<div class="card" style="background:${pct>=80?'var(--bg-soft)':'var(--bg-soft)'}"><div style="font-size:18px;font-weight:800">得分 ${score}/${total}（${pct}%）</div><div style="font-size:12px;color:var(--sub)">${pct>=80?'🎉 好犀利，Paper 3 高分冇難度':pct>=60?'👍 唔錯，重播再聽鞏固':pct>=40?'💪 有進步空間，建議睇稿再聽':'📖 多啲聽英文，慢慢進步'}</div></div><div class="card" style="margin-top:8px">${detail}</div>`;
    Utils.toast('已提交');
  },

     qs:[

       {q:'預算係幾多？', opts:['$3,000','$5,000','$10,000'], a:1},
