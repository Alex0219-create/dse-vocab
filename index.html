<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSE Vocab V5.0</title>
<style>
/* =====================================================================
   DSE Vocab V5.0 — 全新設計系統
   ===================================================================== */
:root{
  --brand-1:#6366F1; --brand-2:#8B5CF6; --brand-3:#A855F7;
  --accent:#0EA5E9; --ok:#10B981; --warn:#F59E0B; --err:#EF4444;
  --bg:#F4F5FB; --bg-soft:#ECEFFA; --card:#FFFFFF; --card-2:#F8F9FF;
  --text:#171A2E; --sub:#667085; --faint:#98A2B3;
  --border:#E6E8F4; --border-2:#D8DCF0;
  --shadow-sm:0 2px 10px rgba(31,41,81,.06);
  --shadow-md:0 8px 28px rgba(31,41,81,.10);
  --shadow-lg:0 16px 48px rgba(31,41,81,.16);
  --grad:linear-gradient(135deg,var(--brand-1),var(--brand-2) 55%,var(--brand-3));
  --grad-soft:linear-gradient(135deg,#EEF1FF,#F5F0FF);
  --radius:20px; --radius-sm:14px; --radius-xs:10px;
  --nav-h:66px; --header-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --brand-1:#818CF8; --brand-2:#A78BFA; --brand-3:#C084FC;
  --accent:#38BDF8; --ok:#34D399; --warn:#FBBF24; --err:#F87171;
  --bg:#0E1017; --bg-soft:#151826; --card:#1A1E2C; --card-2:#202536;
  --text:#EDEFFA; --sub:#9AA3B8; --faint:#6B7280;
  --border:#2A2F42; --border-2:#363D55;
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 8px 28px rgba(0,0,0,.5);
  --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#6366F1,#7C5CF5 55%,#A855F7);
  --grad-soft:linear-gradient(135deg,#1C2140,#241D3D);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;line-height:1.55;
  transition:background .3s,color .3s;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px}
textarea{resize:vertical}
::-webkit-scrollbar{width:0;height:0}
/* ===== 應用外殼 ===== */
.app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* ===== 頂欄 ===== */
.header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;z-index:30;flex-shrink:0}
.header h1{font-size:19px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.header .sub{font-size:11px;color:var(--faint);font-weight:600}
.hd-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--card);box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:transform .15s,box-shadow .2s}
.icon-btn:active{transform:scale(.9)}
/* ===== 視圖容器 ===== */
.views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:6px 16px 20px;display:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.view.active{display:block;animation:viewIn .28s cubic-bezier(.22,.8,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
/* ===== 底部導航 ===== */
.nav{height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(31,41,81,.07);flex-shrink:0;position:relative;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);transition:color .2s;position:relative}
.nav button .ic{font-size:21px;line-height:1;transition:transform .2s}
.nav button.active{color:var(--brand-1)}
.nav button.active .ic{transform:translateY(-2px) scale(1.08)}
.nav button.active::before{content:"";position:absolute;top:-1px;width:26px;height:3.5px;border-radius:0 0 8px 8px;background:var(--grad)}
/* ===== 通用元件 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px;transition:box-shadow .2s}
.card.tap{transition:transform .15s,box-shadow .2s}
.card.tap:active{transform:scale(.975)}
.section-title{font-size:14px;font-weight:800;color:var(--text);margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
.section-title .dot{width:5px;height:16px;border-radius:99px;background:var(--grad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--bg-soft);color:var(--sub);border:1px solid var(--border)}
.chip.brand{background:var(--grad);color:#fff;border:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:11px 18px;border-radius:var(--radius-sm);background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.32);transition:transform .15s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border-2);box-shadow:none}
.btn.soft{background:var(--grad-soft);color:var(--brand-1);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#F87171,#EF4444);box-shadow:0 6px 16px rgba(239,68,68,.3)}
.btn.sm{font-size:12px;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.5;pointer-events:none}
/* 輸入框 */
.field{background:var(--card);border:1.5px solid var(--border-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14.5px;color:var(--text);width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--brand-1);box-shadow:0 0 0 3.5px rgba(99,102,241,.14)}
textarea.field{min-height:150px;line-height:1.7}
/* 彈窗 */
.overlay{position:fixed;inset:0;background:rgba(15,17,30,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex;animation:ovIn .25s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:540px;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + var(--safe-b));max-height:86vh;overflow-y:auto;animation:sheetUp .3s cubic-bezier(.22,.9,.36,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:42px;height:4.5px;border-radius:99px;background:var(--border-2);margin:4px auto 14px}
/* Toast */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 20px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:88vw;text-align:center;box-shadow:var(--shadow-md)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 空狀態 */
.empty{padding:64px 24px;text-align:center;color:var(--sub);font-size:14px}
.empty .e-icon{font-size:44px;margin-bottom:12px}
/* ===== 首頁 ===== */
.hero{background:var(--grad);border-radius:24px;color:#fff;padding:22px 20px;margin:10px 0 14px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(99,102,241,.38)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{font-size:22px;font-weight:800;margin-bottom:3px;position:relative;z-index:1}
.hero p{opacity:.92;font-size:13px;position:relative;z-index:1}
.hero .goal-bar{background:rgba(255,255,255,.28);height:11px;border-radius:99px;margin-top:16px;overflow:hidden;position:relative;z-index:1}
.hero .goal-fill{height:100%;background:#fff;border-radius:99px;transition:width .6s cubic-bezier(.3,.8,.3,1)}
.hero .goal-txt{font-size:12px;margin-top:9px;opacity:.95;display:flex;justify-content:space-between;position:relative;z-index:1}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .num{font-size:23px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-card .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .qb{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px;align-items:flex-start;transition:transform .15s;position:relative;overflow:hidden}
.quick .qb:active{transform:scale(.96)}
.quick .qb .ic{font-size:26px}
.quick .qb .t{font-weight:800;font-size:13.5px}
.quick .qb .d{font-size:11px;color:var(--sub);line-height:1.4}
.quick .qb .badge{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--grad);color:#fff}
.wotd-card{background:var(--grad-soft);border:1px solid var(--border);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.wotd-head{font-size:12.5px;font-weight:800;color:var(--brand-1);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.wotd-date{color:var(--faint);font-weight:600;font-size:11px}
.wotd-phrase{font-size:20px;font-weight:800}
.wotd-stars{color:var(--warn);font-size:13px}
.wotd-mean{font-size:13.5px;color:var(--sub);margin-top:2px}
.wotd-ex{margin-top:6px;font-size:12px;color:var(--sub);background:rgba(99,102,241,.08);border-radius:10px;padding:7px 10px;line-height:1.5}
.mission-card{background:linear-gradient(135deg,#FFFBEB,#FDF2F8);border:1px solid #FDE68A;border-radius:20px;padding:15px 16px;margin-bottom:12px}
[data-theme=dark] .mission-card{background:linear-gradient(135deg,#332E1F,#331F2B);border-color:#55481F}
.mission-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:8px}
.mission-progress{font-size:12px;color:var(--sub);font-weight:600}
.mission-list{display:flex;flex-direction:column;gap:6px}
.mission-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);padding:5px 2px}
.mission-item .m-ic{width:22px;height:22px;border-radius:8px;background:var(--card);border:1.5px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px}
.mission-item.done{color:var(--faint);text-decoration:line-through}
.mission-item.done .m-ic{border-color:var(--ok);background:var(--ok);color:#fff}
/* DSE 進度卡 */
.dse-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.dse-card .dse-left{text-align:center;min-width:60px}
.dse-lv{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.dse-lbl{font-size:10px;color:var(--sub);margin-top:2px}
.dse-mid{flex:1}
.dse-count{font-size:13px;font-weight:700;margin-bottom:6px}
.dse-bar{height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin-bottom:4px}
.dse-fill{height:100%;border-radius:99px;transition:width .6s}
.dse-txt{font-size:10px;color:var(--faint)}
.dse-right{text-align:center;min-width:54px}
.dse-gap{font-size:18px;font-weight:800;color:var(--brand-1)}
/* ===== 閃卡 ===== */
.flash-wrap{display:flex;flex-direction:column;height:100%;padding-top:8px}
.flash-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:12px}
.star-tog{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.star-tog input{accent-color:var(--brand-1);width:15px;height:15px}
.flash-card{flex:1;min-height:0;display:flex;flex-direction:column}
.fc-inner{flex:1;background:var(--card);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s}
.fc-inner::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.fc-inner.flipped{background:linear-gradient(160deg,var(--card),var(--grad-soft))}
.fc-cat{position:absolute;top:16px;left:16px;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;background:var(--bg-soft);color:var(--sub)}
.fc-phrase{font-size:27px;font-weight:800;text-align:center;line-height:1.35;margin-bottom:14px}
.fc-mean{font-size:16.5px;color:var(--sub);text-align:center;line-height:1.6}
.fc-ex{margin-top:12px;font-size:13px;color:var(--sub);background:rgba(99,102,241,.07);border-radius:12px;padding:9px 12px;line-height:1.6;max-width:92%;text-align:center}
.fc-hint{position:absolute;bottom:16px;font-size:11px;color:var(--faint)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fc-btn{padding:13px;border-radius:16px;font-size:14px;font-weight:800;text-align:center;transition:transform .15s;user-select:none}
.fc-btn:active{transform:scale(.95)}
.fc-btn.no{background:#FEF2F2;color:#EF4444;border:1.5px solid #FECACA}
.fc-btn.yes{background:#ECFDF5;color:#10B981;border:1.5px solid #A7F3D0}
[data-theme=dark] .fc-btn.no{background:#2A1A1E;color:#F87171;border-color:#4C2530}
[data-theme=dark] .fc-btn.yes{background:#122720;color:#34D399;border-color:#1F5A46}
.fc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub)}
.fc-empty .ic{font-size:48px}
/* ===== 測驗 ===== */
.quiz-progress{height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.quiz-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.quiz-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:12px}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px 18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.quiz-q{font-size:19px;font-weight:800;margin-bottom:16px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:9px}
.quiz-opt{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1.5px solid var(--border-2);border-radius:15px;padding:13px 14px;font-size:14px;transition:all .18s;text-align:left;line-height:1.45}
.quiz-opt .qk{width:26px;height:26px;border-radius:9px;background:var(--card);border:1.5px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub);flex-shrink:0}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.correct{border-color:var(--ok);background:#ECFDF5}
.quiz-opt.wrong{border-color:var(--err);background:#FEF2F2}
.quiz-opt.correct .qk,.quiz-opt.wrong .qk{border-color:transparent;color:#fff}
.quiz-opt.correct .qk{background:var(--ok)}
.quiz-opt.wrong .qk{background:var(--err)}
[data-theme=dark] .quiz-opt.correct{background:#12281F}
[data-theme=dark] .quiz-opt.wrong{background:#2A1A1E}
.quiz-explain{margin-top:14px;font-size:13px;background:var(--grad-soft);border-radius:14px;padding:12px 14px;line-height:1.6;display:none}
.quiz-explain.show{display:block;animation:viewIn .25s}
/* 詞庫列表 */
.list-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s}
.list-item:active{transform:scale(.98)}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-ph{font-size:14.5px;font-weight:700}
.list-item .li-mean{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-stars{font-size:10px;color:var(--warn);letter-spacing:1px}
.list-item .li-fav{font-size:16px;color:var(--warn)}
.list-item.fav-hint{outline:2px solid var(--warn);outline-offset:2px}
.search-bar{display:flex;gap:8px;margin:10px 0 12px}
.search-bar .field{flex:1}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 15px;border-radius:99px;background:var(--card);border:1.5px solid var(--border-2);color:var(--sub);transition:all .2s}
.cat-chip.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
/* ===== 寫作 & 作文評分 ===== */
.wt-genre{margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--brand-1);letter-spacing:.4px}
.wt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wt-fmt{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px;cursor:pointer;transition:transform .15s;text-align:left;box-shadow:var(--shadow-sm)}
.wt-fmt:active{transform:scale(.96)}
.wt-fmt .t{font-size:13.5px;font-weight:800;color:var(--text)}
.wt-fmt .p{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.4}
.wt-group{margin-bottom:16px}
.wt-group h4{margin:0 0 9px;font-size:13px;color:var(--brand-1);display:flex;align-items:center;gap:6px}
.wt-phrase{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.wt-phrase .txt{font-size:14px;font-weight:600;line-height:1.45}
.wt-phrase .mean{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4}
.wt-copy{flex-shrink:0;font-size:11px;padding:6px 11px;border:1.5px solid var(--border-2);border-radius:20px;background:transparent;color:var(--brand-1);cursor:pointer;transition:all .2s}
.wt-copy:hover{background:var(--brand-1);color:#fff}
.wt-copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* 作文評分 */
.essay-toolbar{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.essay-toolbar .btn{flex:1;min-width:110px}
.essay-prompt{font-size:13px;background:var(--grad-soft);border-radius:14px;padding:11px 14px;line-height:1.65;margin-bottom:12px;color:var(--text);border:1px solid var(--border)}
.essay-prompt .q-title{font-weight:800;color:var(--brand-1);margin-bottom:4px;font-size:13.5px}
.grade-result{animation:viewIn .3s}
.score-hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.score-hero::before{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.5}
.score-ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;z-index:1}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--bg-soft);stroke-width:9}
.score-ring .ring-fill{fill:none;stroke:url(#scoreGrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}
.score-ring .ring-num{position:absolute;font-size:27px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score-ring .ring-den{position:absolute;margin-top:30px;font-size:11px;color:var(--faint);font-weight:700}

    <p>全新設計介面 × 底層重構 × 新增 AI 作文評分系統<br>同你並肩衝刺 DSE 英文科！</p>

<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
 * DSE Vocab V5.0 — 底層架構
 * ===================================================================== */
const Utils = {
  $: s => document.querySelector(s),
  $$: s => [...document.querySelectorAll(s)],
  esc: s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; },
  today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  dseDays(){ const target=Store.state.dseDate||'2027-04-06'; const t=new Date(target+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0); return Math.max(0, Math.round((t-n)/86400000)); },
  masteryScore(){
    const s=Store.state;
    if(!s.known.size && !s.wrong.size) return 0;
    const wgt=1+(s.wrong.size/Data.raw.length)*2;
    return Math.min(100, Math.round(s.known.size/Data.raw.length*100*wgt*100)/100);
  },
  gapToTop(){
    const s=Store.state;
    if(!s.known.size) return 0;
    const wgt=1+(s.wrong.size/Data.raw.length)*0.3;
    const score=Math.min(100, Math.round(s.known.size/Data.raw.length*100*wgt*100)/100);
    return Math.max(0, Math.round(100-score));
  },
  toast(msg){
    const t=Utils.$('#toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(Utils._toastT);
    Utils._toastT=setTimeout(()=>t.classList.remove('show'),1900);
  },
  todayKey(){ return Utils.today(); },
  wordCount(text){ const m=(text||'').match(/[A-Za-z']+/g); return m?m.length:0; },
  sentenceCount(text){ const m=(text||'').match(/[^.!?]+[.!?]+/g); return m?m.length:Math.max(1,(text||'').trim().split(/\s+/).length?1:0); },
  wordFreq(text){ const m=(text||'').toLowerCase().match(/[a-z']+/g)||[]; const f={}; m.forEach(w=>f[w]=(f[w]||0)+1); return f; },
  /* 段落切分 */
  paragraphs(text){ return (text||'').split(/\n\s*\n|\n+/).map(p=>p.trim()).filter(p=>p.length>0); },
  /* 平均句長 */
  avgSentenceLen(text){ const n=this.wordCount(text), s=this.sentenceCount(text); return n&&s?Math.round(n/s*10)/10:0; }
};
/* ===== 本地儲存 ===== */
const Storage = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  idbGet(key){ return new Promise(res=>{ try{ const r=indexedDB.open('dse_vocab',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ const db=r.result, tx=db.transaction('kv').objectStore('kv').get(key); tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null); }; r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  idbSet(key,val){ return new Promise(res=>{ try{ const r=indexedDB.open('dse_vocab',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ const db=r.result, tx=db.transaction('kv','readwrite').objectStore('kv').put(val,key); tx.onsuccess=()=>res(true); tx.onerror=()=>res(false); }; r.onerror=()=>res(false); }catch(e){ res(false); } }); }
};
/* ===== 狀態管理 ===== */
const Store = {
  state: null, _subs: [],
  key(w){ return w.id; },
  defaultState(){ return {
    v:3, known:new Set(), wrong:new Set(), fav:new Set(),
    sched:{}, history:{}, goal:20, mode:'all', dark:false,
    quizCount:0, onboarded:false, dseDate:'', essay:{ apiKey:'', provider:'deepseek', model:'deepseek-chat', useApi:false }
  }; },
  init(){
    const raw=Storage.get('dse_state');
    let saved=null; try{ saved=raw?JSON.parse(raw):null; }catch(e){}
    const d=this.defaultState();
    const st={ ...d, ...(saved||{}),
      known:new Set(saved?.known||[]), wrong:new Set(saved?.wrong||[]), fav:new Set(saved?.fav||[]),
      sched:saved?.sched||{}, history:saved?.history||{}, essay:{ ...d.essay, ...(saved?.essay||{}) }
    };
    this.state=st;
    // 相容舊版 key
    ['known','wrong','fav'].forEach(k=>{ const v=Storage.get(k); if(v){ try{ const arr=JSON.parse(v); if(Array.isArray(arr)) this.state[k]=new Set(arr); }catch(e){} } });
    const dk=Storage.get('dark'); if(dk==='1' && !saved) this.state.dark=true;
    const og=Storage.get('onboarded'); if(og==='1') this.state.onboarded=true;
    if(Storage.get('goal')) this.state.goal=parseInt(Storage.get('goal'),10)||20;
  },
  persist(){
    const s=this.state;
    const snap={ v:3, known:[...s.known], wrong:[...s.wrong], fav:[...s.fav], sched:s.sched, history:s.history, goal:s.goal, mode:s.mode, dark:s.dark, quizCount:s.quizCount, onboarded:s.onboarded, dseDate:s.dseDate, essay:s.essay };
    Storage.set('dse_state', JSON.stringify(snap));
    Storage.idbSet('backup', { s: JSON.stringify(snap), t: Date.now() });
  },
  subscribe(fn){ this._subs.push(fn); },
  notify(){ this._subs.forEach(fn=>{ try{ fn(); }catch(e){} }); },
  reset(){ this.state=this.defaultState(); this.persist(); },
  importSnapshot(snap){
    const d=this.defaultState();
    this.state={ ...d, ...snap,
      known:new Set(snap.known||[]), wrong:new Set(snap.wrong||[]), fav:new Set(snap.fav||[]),
      sched:snap.sched||{}, history:snap.history||{}, essay:{ ...d.essay, ...(snap.essay||{}) } };
    this.persist();
  }
};
/* ===== 詞庫載入 ===== */
const Data = {
  raw:[], byId:new Map(), index:new Map(), __src:'',
  async load(){
    const inline=window.__DSE_DATA;
    let words=[];
    if(Array.isArray(inline)&&inline.length){ words=inline; Data.__src='inline'; }
    else{
      const fetcher=async ()=>{
        try{
          const res=await fetch('dse_vocab_data.js', {cache:'no-cache'});
          if(res.ok){ const txt=await res.text(); const m=txt.match(/window\.__DSE_DATA\s*=\s*(\[[\s\S]*\]);?\s*$/); if(m){ try{ return JSON.parse(m[1]); }catch(e){} } }
        }catch(e){}
        try{
          const res2=await fetch('dse_vocab_data.json', {cache:'no-cache'});
          if(res2.ok){ const j=await res2.json(); if(Array.isArray(j)&&j.length) return j; }
        }catch(e){}
        return null;
      };
      words=await fetcher();
    }
    if(!words||!words.length) return 0;
    Data.raw=words; Data.byId=new Map(words.map(w=>[w.id,w]));
    Data._buildIndex();
    return words.length;
  },
  _buildIndex(){
    const idx=new Map();
    const add=(tok,id)=>{ if(!tok)return; let a=idx.get(tok); if(!a){ a=[]; idx.set(tok,a); } if(a[a.length-1]!==id) a.push(id); };
    Data.raw.forEach(w=>{
      add('#'+w.id, w.id);
      (w.phrase||'').toLowerCase().split(/\s+/).forEach(t=>add(t,w.id));
      const cn=w.meaning; if(cn) add('@'+cn.slice(0,4), w.id);
      add(w.category, w.id);
    });
    Data.index=idx;
  },
  search(q){
    q=(q||'').trim().toLowerCase();
    if(!q) return Data.raw;
    const hits=new Set();
    if(Data.index.has('#'+q)){ Data.index.get('#'+q).forEach(id=>hits.add(id)); }
    Data.raw.forEach(w=>{
      if((w.phrase||'').toLowerCase().includes(q)) hits.add(w.id);
      else if((w.meaning||'').includes(q)) hits.add(w.id);
    });
    const tokens=q.split(/[^a-z0-9']+/).filter(Boolean);
    if(tokens.length>1){ const t0=tokens[0]; (Data.index.get(t0)||[]).forEach(id=>{ const w=Data.byId.get(id); if(w&&tokens.every(t=>(w.phrase||'').toLowerCase().includes(t))) hits.add(id); }); }
    return [...hits].map(id=>Data.byId.get(id));
  }
};
/* ===== 卡片樣式共用 ===== */
const UI = {
  current:'home',
  go(view){
    UI.current=view;
    Utils.$$('.view').forEach(v=>v.classList.remove('active'));
    const el=document.getElementById('view-'+view);
    if(el) el.classList.add('active');
    Utils.$$('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    Utils.$('.views').scrollTop=0;
  },
  card(cls, html){ return `<div class="card ${cls||''}">${html}</div>`; }
};
/* ===== SM-2 演算法 ===== */
const SM2 = {
  review(w, quality){
    const s=Store.state;
    const k=Store.key(w);
    const cur=s.sched[k]||{int:0,rep:0,due:Date.now(),ef:2.5};
    let {int,rep,ef}=cur;
    if(quality>=3){
      if(rep===0) int=1;
      else if(rep===1) int=6;
      else int=Math.round(int*ef);
      rep++;
    }else{
      rep=0; int=1;
    }
    ef=Math.max(1.3, ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    const due=Date.now()+int*86400000;
    s.sched[k]={int,rep,due,ef};
    return {int,rep,ef,due};
  },
  duePool(cat, star){
    const s=Store.state;
    const now=Date.now();
    const all=cat==='all'?Data.raw:Data.raw.filter(w=>w.category===cat);
    const pool=star>1?all.filter(w=>w.stars>=star):all;
    const due=pool.filter(w=>{ const x=s.sched[Store.key(w)]; return x&&x.due<=now; });
    const fresh=pool.filter(w=>{ const k=Store.key(w); return !s.sched[k]&&!s.known.has(k); });
    const review=pool.filter(w=>s.wrong.has(Store.key(w))&&!due.includes(w)&&!fresh.includes(w));
    const rest=pool.filter(w=>!due.includes(w)&&!fresh.includes(w)&&!review.includes(w));
    const q=[...due.sort((a,b)=>s.sched[Store.key(a)].due-s.sched[Store.key(b)].due), ...Utils.shuffle(fresh), ...Utils.shuffle(review), ...Utils.shuffle(rest)];
    return q;
  }
};
/* =====================================================================
 * 任務系統（每日任務）
 * ===================================================================== */
const Mission = {
  get todayKey(){ return Utils.today(); },
  progress(){ return Store.state.history[this.todayKey]||0; },
  list(){
    const p=this.progress();
    const learned=p;
    const reviewed=Object.keys(Store.state.sched).length;
    const quizDone=Store.state.quizCount;
    return [
      {ic:'📖', t:'學習詞彙', goal:Store.state.goal, done:learned, unit:'詞'},
      {ic:'🔁', t:'複習詞彙', goal:10, done:Math.min(reviewed,10), unit:'詞'},
      {ic:'📝', t:'完成測驗', goal:1, done:Math.min(quizDone,1), unit:'次'}
    ];
  },
  doneCount(){
    const s=Store.state;
    return this.list().filter(x=>x.done>=x.goal).length;
  },
  render(){
    const items=this.list().map(x=>{
      const done=x.done>=x.goal;
      return `<div class="mission-item ${done?'done':''}"><span class="m-ic">${done?'✓':x.ic}</span><span>${x.t}（${Math.min(x.done,x.goal)}/${x.goal}${x.unit}）</span></div>`;
    }).join('');
    return `<div class="mission-card">
      <div class="mission-head"><span>🎯 今日任務</span><span class="mission-progress">${this.doneCount()}/3 完成</span></div>
      <div class="mission-list">${items}</div>
    </div>`;
  }
};
/* =====================================================================
 * 首頁
 * ===================================================================== */
const Home = {
  wotd(){
    const n=Data.raw.length;
    if(!n) return null;
    const seed=Utils.today().split('-').map(Number);
    const idx=(seed[0]*31+seed[1]*7+seed[2])%n;
    return Data.raw[idx];
  },
  render(){
    const s=Store.state;
    const total=Data.raw.length;

const Flash = {
  queue:[], idx:0, flipped:false, star:1, _cur:null,
  enter(){ Flash._load(); },
  _load(){
    const q=SM2.duePool('all', Flash.star);
    Flash.queue=q; Flash.idx=0; Flash.flipped=false;
    Flash.render();
  },
  render(){
    const wrap=Utils.$('#flashWrap');
    if(!Flash.queue.length){
      wrap.innerHTML=`<div class="fc-empty"><div class="ic">🎉</div><div>冇需要複習嘅詞彙</div><div class="btn sm soft" onclick="App.go('browse')">去詞庫學新詞</div></div>`;
      return;
    }
    const w=Flash.queue[Flash.idx];
    Flash._cur=w;
    wrap.innerHTML=`
      <div class="flash-top">
        <span>${Flash.idx+1} / ${Flash.queue.length}</span>
        <label class="star-tog"><input type="checkbox" ${Flash.star>1?'checked':''} onchange="Flash.setStar(this.checked)"> 只睇 ★${Flash.star>1?'':'≥'}${Flash.star>1?'':''}</label>
      </div>
      <div class="flash-card">
        <div class="fc-inner ${Flash.flipped?'flipped':''}" id="fcCard" onclick="Flash.flip()">
          <span class="fc-cat">${Utils.esc(w.category)}</span>
          <div class="fc-phrase">${Utils.esc(w.phrase)}</div>
          ${Flash.flipped?`<div class="fc-mean">${Utils.esc(w.meaning)}</div>${w.example?`<div class="fc-ex">${Utils.esc(w.example)}</div>`:''}`:`<div class="fc-hint">點擊揭曉 👆</div>`}
        </div>
        ${Flash.flipped?`
        <div class="fc-actions">
          <div class="fc-btn no" onclick="Flash.rate(0)">✗ 唔記得</div>
          <div class="fc-btn yes" onclick="Flash.rate(1)">✓ 記得</div>
        </div>`:''}
      </div>
    `;
  },
  flip(){ Flash.flipped=!Flash.flipped; Flash.render(); },
  setStar(on){ Flash.star=on?2:1; Flash._load(); },
  rate(ok){
    const w=Flash._cur; if(!w) return;
    const k=Store.key(w);
    if(ok){ Store.state.known.add(k); Store.state.wrong.delete(k); }
    else{ Store.state.wrong.add(k); Store.state.known.delete(k); }
    SM2.review(w, ok?5:0);
    const today=Utils.today();
    Store.state.history[today]=(Store.state.history[today]||0)+1;
    Store.persist(); Store.notify();
    Flash.idx++;
    if(Flash.idx>=Flash.queue.length){ Flash._load(); Utils.toast('完成一輪複習 🎉'); return; }
    Flash.flipped=false;
    Flash.render();
  },
  swipe(dir){ Flash.flip(); }
};

const WritingToolkit = {
  _fmt: null, _genre: null,
  enter(){ WritingToolkit._fmt=null; WritingToolkit._genre=null; WritingToolkit.render(); },
  render(){
    const v=Utils.$('#view-writing');
    if(WritingToolkit._fmt){
      WritingToolkit._renderDetail(); return;
    }
    const genreTabs=WRITING_GENRES.map(g=>`<button class="cat-chip ${WritingToolkit._genre===g?'active':''}" onclick="WritingToolkit.setGenre('${g.replace(/'/g,"\\'")}')">${g.replace(' Writing','')}</button>`).join('');
    const list=Object.entries(WRITING_MAP)
      .filter(([k,val])=>!WritingToolkit._genre||val.genre===WritingToolkit._genre)
      .map(([k,val])=>`<div class="wt-fmt" onclick="WritingToolkit.open('${k.replace(/'/g,"\\'")}')"><div class="t">${Utils.esc(k)}</div><div class="p">${Utils.esc(val.purpose)}</div></div>`).join('');
    v.innerHTML=`
      <div class="essay-toolbar" style="margin-top:10px">
        <button class="btn sm soft" onclick="App.go('essay')">🤖 AI 作文評分</button>
        <button class="btn sm ghost" onclick="App.go('more')">☰ 更多工具</button>
      </div>
      <div class="section-title"><span class="dot"></span>揀寫作格式</div>
      <div class="cat-chips">${genreTabs}</div>
      <div class="wt-grid">${list}</div>
      <div class="dse-tip" style="font-size:11px;color:var(--sub);background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:11px;line-height:1.6;margin-top:12px">💡 揀格式後會顯示對應嘅實用片語，撳「複製」即可插入作文。</div>
    `;
  },
  setGenre(g){ WritingToolkit._genre=WritingToolkit._genre===g?null:g; WritingToolkit.render(); },
  open(k){ WritingToolkit._fmt=k; WritingToolkit._renderDetail(); },
  _renderDetail(){
    const v=Utils.$('#view-writing');
    const fmt=WRITING_MAP[WritingToolkit._fmt];
    const groups={};
    fmt.phrases.forEach(p=>{ (groups[p.category]=groups[p.category]||[]).push(p); });
    v.innerHTML=`
      <button class="btn ghost sm" style="margin:10px 0 6px" onclick="WritingToolkit._fmt=null;WritingToolkit.render()">← 返回格式列表</button>
      <div class="wt-detail-top" style="background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px 15px;margin-bottom:12px">
        <h3 style="font-size:16px;font-weight:800;margin-bottom:4px">${Utils.esc(WritingToolkit._fmt)}</h3>
        <div class="meta" style="font-size:12px;color:var(--sub)">${Utils.esc(fmt.genre)} · ${Utils.esc(fmt.purpose)}</div>
      </div>
      ${Object.entries(groups).map(([g,ps])=>`<div class="wt-group"><h4>${Utils.esc(g)}</h4>${ps.map(p=>`<div class="wt-phrase"><div><div class="txt">${Utils.esc(p.text)}</div><div class="mean">${Utils.esc(p.meaning)}</div></div><button class="wt-copy" onclick="WritingToolkit.copy(this,'${Utils.esc(p.text).replace(/'/g,"\\'")}')">複製</button></div>`).join('')}</div>`).join('')}
    `;
  },
  copy(btn, txt){
    try{ navigator.clipboard.writeText(txt); }catch(e){}
    btn.textContent='✓ 已複製'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='複製'; btn.classList.remove('done'); },1400);
  }
};

    const master=Utils.masteryScore();
    const hist=Object.entries(s.history).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);

const Quiz = {
  qs:[], idx:0, score:0, answered:false, cat:'all', mode:'choice',
  enter(){ Quiz._setup(); },
  _setup(){
    const s=Store.state;
    const cat=Quiz.cat;
    let pool=cat==='all'?Data.raw:Data.raw.filter(w=>w.category===cat);
    if(Quiz.mode==='known') pool=pool.filter(w=>s.known.has(Store.key(w)));
    if(Quiz.mode==='wrong') pool=pool.filter(w=>s.wrong.has(Store.key(w)));
    if(pool.length<4){ Utils.toast('詞彙不足，試下其他範圍'); return; }
    const picked=Utils.shuffle(pool).slice(0,10);
    Quiz.qs=picked.map(w=>{
      const opts=Utils.shuffle(pool).filter(x=>x.id!==w.id).slice(0,3);
      const all=Utils.shuffle([w,...opts]);
      return {w, opts:all};
    });
    Quiz.idx=0; Quiz.score=0; Quiz.answered=false;
    Quiz.render();
  },
  render(){
    const v=Utils.$('#view-quiz');
    if(!Quiz.qs.length){ v.innerHTML=`<div class="empty"><div class="e-icon">📝</div>撳下面開始測驗</div>`; return; }
    const q=Quiz.qs[Quiz.idx];
    const pct=Math.round(Quiz.idx/Quiz.qs.length*100);
    v.innerHTML=`
      <div class="quiz-progress"><div class="quiz-fill" style="width:${pct}%"></div></div>
      <div class="quiz-meta"><span>${Quiz.idx+1} / ${Quiz.qs.length}</span><span>答啱 ${Quiz.score}</span></div>
      <div class="quiz-card">
        <div class="quiz-q">${Utils.esc(q.w.meaning)}</div>
        <div class="quiz-opts">
          ${q.opts.map((o,i)=>`<button class="quiz-opt ${Quiz.answered?(o.id===q.w.id?'correct':(Quiz._picked===o.id?'wrong':'')):''}" onclick="Quiz.pick(${i})"><span class="qk">${'ABCD'[i]}</span><span>${Utils.esc(o.phrase)}</span></button>`).join('')}
        </div>
        ${Quiz.answered?`<div class="quiz-explain show">✅ 正確答案：<b>${Utils.esc(q.w.phrase)}</b>${q.w.example?`<br>📝 ${Utils.esc(q.w.example)}`:''}<br><button class="btn sm soft" style="margin-top:10px" onclick="Quiz.next()">下一題 →</button></div>`:''}
      </div>
    `;
  },
  pick(i){
    if(Quiz.answered) return;
    const q=Quiz.qs[Quiz.idx];
    Quiz.answered=true; Quiz._picked=q.opts[i].id;
    const ok=q.opts[i].id===q.w.id;
    if(ok){ Quiz.score++; Store.state.known.add(Store.key(q.w)); }
    else Store.state.wrong.add(Store.key(q.w));
    const today=Utils.today();
    Store.state.history[today]=(Store.state.history[today]||0)+1;
    Store.state.quizCount=(Store.state.quizCount||0)+1;
    Store.persist(); Store.notify();
    Quiz.render();
  },
  next(){
    Quiz.idx++;
    if(Quiz.idx>=Quiz.qs.length){
      const pct=Math.round(Quiz.score/Quiz.qs.length*100);
      Utils.$('#view-quiz').innerHTML=`
        <div class="empty">
          <div class="e-icon">${pct>=80?'🏆':pct>=60?'💪':'📚'}</div>
          <div style="font-size:20px;font-weight:800;margin-bottom:6px">${Quiz.score} / ${Quiz.qs.length}</div>
          <div style="margin-bottom:18px">正確率 ${pct}%${pct>=80?' · 好犀利！':pct>=60?' · 繼續努力！':' · 錯詞已加入複習'}</div>
          <button class="btn" onclick="Quiz._setup()">再測一次</button>
          <button class="btn ghost sm" style="margin-top:10px" onclick="App.go('home')">返回首頁</button>
        </div>`;
      Store.notify();
      return;
    }
    Quiz.answered=false;
    Quiz.render();
  },
  /* 測驗設置面板（喺詞庫頁撳入） */
  settingsHtml(){
    return `
      <div class="section-title"><span class="dot"></span>測驗設置</div>
      <div class="card" style="margin-bottom:12px">
        <div class="setting-row"><div class="st-info"><div class="st-t">範圍</div><div class="st-d">選擇測驗詞庫範圍</div></div>
          <select class="field" style="width:130px;padding:8px 10px" id="quizCat">
            <option value="all">全部詞庫</option>
            ${[...new Set(Data.raw.map(w=>w.category))].map(c=>`<option value="${Utils.esc(c)}">${Utils.esc(c)}</option>`).join('')}
          </select></div>
        <div class="setting-row"><div class="st-info"><div class="st-t">詞彙類型</div><div class="st-d">限縮測驗對象</div></div>
          <select class="field" style="width:130px;padding:8px 10px" id="quizMode">
            <option value="all">全部</option><option value="known">已掌握</option><option value="wrong">常錯詞</option>
          </select></div>
        <button class="btn" style="width:100%;margin-top:8px" onclick="Quiz.startFromSettings()">開始測驗</button>
      </div>`;
  },
  startFromSettings(){
    Quiz.cat=Utils.$('#quizCat').value;
    Quiz.mode=Utils.$('#quizMode').value;

    Browse.q=q;
    const base=Data.search(q);
    if(Browse.cat==='全部') Browse.filtered=base;
    else if(Browse.cat==='★5') Browse.filtered=base.filter(w=>w.stars>=5);
    else if(Browse.cat==='未掌握') Browse.filtered=base.filter(w=>!Store.state.known.has(Store.key(w)));
    else Browse.filtered=base.filter(w=>w.category===Browse.cat);
    Browse.renderList();
  },
  renderList(){
    const v=Utils.$('#view-browse');
    const cats=['全部','★5','未掌握',...[...new Set(Data.raw.map(w=>w.category))]];
    v.innerHTML=`
      <div class="search-bar"><input class="field" id="browseSearch" placeholder="🔍 搜尋詞彙／中文意思…" value="${Utils.esc(Browse.q)}" oninput="Browse.search(this.value)"></div>
      <div class="cat-chips">${cats.map(c=>`<button class="cat-chip ${Browse.cat===c?'active':''}" onclick="Browse.setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>
      <div style="font-size:11px;color:var(--faint);margin:2px 2px 10px">共 ${Browse.filtered.length} 詞 · 長按可收藏</div>
      ${Browse.filtered.map(w=>`<div class="list-item" id="li-${w.id}" onclick="App.openDetail('${w.id}')" oncontextmenu="event.preventDefault();App.toggleFavFromList('${w.id}')">
        <div class="li-main"><div class="li-ph">${Utils.esc(w.phrase)} ${w.stars>=4?'<span class="li-stars">'+'★'.repeat(Math.min(w.stars,5))+'</span>':''}</div><div class="li-mean">${Utils.esc(w.meaning)}</div></div>
        <div class="li-fav">${Store.state.fav.has(Store.key(w))?'★':''}</div>
      </div>`).join('')||`<div class="empty"><div class="e-icon">🔍</div>搵唔到相關詞彙</div>`}
    `;
  }
};
/* =====================================================================
 * DSE 作文評分 AI 系統（V5 新增）
 * 跟 HKEAA Paper 2 評分框架：Content 10 / Organisation 10 / Language 10
 * 雙模式：離線規則引擎（默認）+ 可選 LLM API 深度評分
 * ===================================================================== */
const EssayGrader = {
  topic:'', text:'', result:null, loading:false,
  prompts:[
    'Some people believe that social media has more negative effects than positive effects on young people. Do you agree?',
    'Your school is considering banning smartphones on campus. Write an article expressing your views.',
    'Hong Kong should do more to tackle plastic pollution. Write a letter to the editor to express your views.',
    'Many young people in Hong Kong are reluctant to pursue further studies. What are your views?',
    'Volunteering should be a compulsory part of the school curriculum. Do you agree?',
    'Technology has made our lives more stressful rather than more convenient. Do you agree?',
    'Your school is planning to organise a community service day. Write a proposal to the principal.',
    'Write a story that begins with the sentence: "It was the strangest day of my life."',
    'Some people argue that exams should be abolished. Write an article discussing the pros and cons.',
    'Write a letter to a friend about a memorable experience you had recently.'
  ],
  /* ---------- 離線分析核心 ---------- */
  analyzeLocal(text){
    const lower=(text||'').toLowerCase();
    const words=lower.match(/[a-z']+/g)||[];
    const wordCount=words.length;
    const sentences=text.match(/[^.!?]+[.!?]+/g)||[];
    const sentCount=Math.max(1,sentences.length);
    const paras=Utils.paragraphs(text);
    const paraCount=paras.length;
    const freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1);
    const uniq=Object.keys(freq).length;
    const avgLen=wordCount&&sentCount?Math.round(wordCount/sentCount*10)/10:0;
    const lens=sentences.map(s=>Utils.wordCount(s));
    const longCnt=lens.filter(l=>l>=18).length;
    const shortCnt=lens.filter(l=>l<=6).length;
    const variety=Math.min(1,(longCnt+shortCnt)/sentCount);
    const connectors=['firstly','secondly','thirdly','finally','next','then','moreover','furthermore','in addition','additionally','besides','however','nevertheless','nonetheless','on the other hand','in contrast','conversely','therefore','thus','hence','consequently','as a result','accordingly','for example','for instance','in particular','such as','in conclusion','to sum up','overall','in summary','lastly','in short','as well as','not only','on the whole','in general'];
    const connUsed=connectors.filter(c=>lower.includes(c));
    const connCount=connectors.reduce((n,c)=>{ const m=lower.match(new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')); return n+(m?m.length:0); },0);
    const connUniq=new Set(connUsed).size;
    let advancedHits=[];
    if(Data.raw.length){
      const advPool=Data.raw.filter(w=>w.stars>=3||/進階|潮語|慣用/.test(w.category||''));
      advancedHits=advPool.filter(w=>{
        const ph=(w.phrase||'').toLowerCase();
        return ph.split(/\s+/).length>1 ? lower.includes(ph) : words.includes(ph);
      }).slice(0,12);
    }
    const advRatio=wordCount?Math.round(advancedHits.length/wordCount*1000)/10:0;
    const stop=new Set(['the','a','an','and','or','but','of','to','in','on','at','for','with','is','are','was','were','be','been','i','you','he','she','it','we','they','my','your','his','her','our','their','this','that','these','those','as','by','from','up','down','so','if','not','can','will','would','should','could','may','might','there','have','has','had','do','does','did']);
    const rep=Object.entries(freq).filter(([w,n])=>n>=5&&!stop.has(w)).map(([w,n])=>`${w}×${n}`);
    const repPenalty=Math.min(3, rep.length*0.8);
    const grammarChecks=[
      {re:/\b(a)\s+([aeiou])/gi, msg:'不定冠詞錯誤：a 後面接母音開頭應為 an'},
      {re:/\bi\s+(is|am|are)\b/gi, msg:'人稱代詞 I 必須大寫'},
      {re:/\b(the|a|an)\s+(\w+)s\s+(is|was)\b/gi, msg:'主謂一致可疑：單數主語配複數動詞'},
      {re:/\b(recieve|definately|goverment|accomodate|enviroment|becuase|wich|peice|seperate|occured|freind|beleive|tommorow|adress|alot)\b/gi, msg:'常見拼寫錯誤'},
      {re:/\b(there)\s+(is|are)\s+(\w+)s\b/gi, msg:'there is/are 搭配需檢查'},
      {re:/\b(is|are|was|were)\s+(\w+)ed\b/gi, msg:'動詞時態 / 被動語態需檢查'}
    ];
    const grammarIssues=[];
    grammarChecks.forEach(g=>{ const m=text.match(g.re); if(m&&m[0]){ grammarIssues.push({msg:g.msg, found:m[0]}); } });
    let content=5;
    if(wordCount>=550) content=9;
    else if(wordCount>=450) content=8.5;
    else if(wordCount>=350) content=7.5;
    else if(wordCount>=250) content=6;
    else if(wordCount>=150) content=4.5;
    else content=Math.max(1,Math.round(wordCount/40));
    if(paraCount>=3&&paraCount<=6) content=Math.min(10,content+1);
    else if(paraCount>=2) content=Math.min(10,content+0.4);
    if(connCount>=4) content=Math.min(10,content+0.5);
    if(/for example|for instance|such as|a case in point|take .* as an example/i.test(text)) content=Math.min(10,content+0.5);
    let org=4.5;
    if(paraCount>=3&&paraCount<=6) org+=2.5;
    else if(paraCount>=2) org+=1.2;
    if(/in conclusion|to sum up|overall|in short|all in all|lastly|finally/i.test(text)) org+=1.2;
    if(/in my opinion|i believe|i think|from my perspective|it is widely|nowadays|in recent years/i.test(text)) org+=0.8;
    org+=Math.min(2.5, connUniq*0.5);
    org=Math.min(10,Math.max(1,Math.round(org*10)/10));
    let lang=4;
    if(avgLen>=10&&avgLen<=20) lang+=2.2;
    else if(avgLen>=8&&avgLen<=24) lang+=1.2;
    lang+=Math.min(2, advRatio*0.8);
    lang+=variety*1.2;
    lang-=Math.min(2.5, grammarIssues.length*0.7);
    lang-=repPenalty;
    lang=Math.min(10,Math.max(1,Math.round(lang*10)/10));
    const total=Math.round((content+org+lang)*10)/10;
    const level=EssayGrader.levelOf(total);
    const feedback=EssayGrader._buildFeedback({wordCount,sentCount,paraCount,avgLen,connCount,connUniq,advancedHits,advRatio,rep,grammarIssues,longCnt,shortCnt,variety});
    return {content:Math.round(content*10)/10, organisation:Math.round(org*10)/10, language:Math.round(lang*10)/10, total, level, mode:'local', stats:{wordCount,sentCount,paraCount,avgLen,connCount,connUniq,advancedHits,advRatio,rep,grammarIssues,longCnt,shortCnt}, feedback};
  },
  levelOf(total){
    if(total>=27) return {lv:'5**', tag:'頂尖', color:'#F59E0B'};
    if(total>=24) return {lv:'5*', tag:'優秀', color:'#10B981'};
    if(total>=21) return {lv:'5', tag:'良好', color:'#22C55E'};
    if(total>=18) return {lv:'4', tag:'中上', color:'#0EA5E9'};
    if(total>=15) return {lv:'3', tag:'中等', color:'#6366F1'};
    if(total>=11) return {lv:'2', tag:'需加強', color:'#F97316'};
    return {lv:'1', tag:'有待提升', color:'#EF4444'};
  },
  _buildFeedback(m){
    const {wordCount,sentCount,paraCount,avgLen,connCount,connUniq,advancedHits,advRatio,rep,grammarIssues,longCnt,shortCnt,variety}=m;
    const strengths=[], weaknesses=[], tips=[];
    if(wordCount>=450) strengths.push(`字數充足（${wordCount} 字），能完整展開論點`);
    else if(wordCount>=300) strengths.push(`字數達標（${wordCount} 字），論述具一定深度`);
    else weaknesses.push(`字數不足（${wordCount} 字），DSE Paper 2 建議約 500 字`);
    if(paraCount>=3&&paraCount<=6) strengths.push(`段落結構清晰（${paraCount} 段）`);
    else if(paraCount<3) weaknesses.push(`段落太少（${paraCount} 段），論點應分開逐段論述`);
    else weaknesses.push(`段落偏多（${paraCount} 段），注意段落主題統一`);
    if(connCount>=5) strengths.push(`連接詞運用豐富（${connCount} 次、${connUniq} 種）`);
    else if(connCount>=3) strengths.push(`已使用連接詞（${connCount} 次），可增加多樣性`);
    else weaknesses.push(`連接詞偏少（${connCount} 次），文章欠流暢過渡`);
    if(avgLen>=10&&avgLen<=20) strengths.push(`平均句長適中（${avgLen} 詞／句），可讀性佳`);
    else if(avgLen>20) weaknesses.push(`平均句長偏長（${avgLen} 詞／句），注意避免冗長`);
    else weaknesses.push(`平均句長偏短（${avgLen} 詞／句），可嘗試加入複雜句式`);
    if(longCnt>=2&&shortCnt>=2) strengths.push(`長短句搭配得宜，句式富節奏感`);
    else tips.push('嘗試混合長短句（如 18 詞以上長句 + 6 詞以內短句），提升文章節奏');
    if(advancedHits.length>=3){
      strengths.push(`詞彙水平高：用到 ${advancedHits.slice(0,5).map(x=>x.phrase).join('、')} 等高階詞`);
      tips.push('高階詞使用恰當，可持續擴大進階詞彙庫（參考「進階詞彙A／進階短語B」分類）');
    }else if(advancedHits.length>0){
      tips.push(`已見高階詞（${advancedHits.map(x=>x.phrase).join('、')}），可再增加 2-3 個提升詞彙分`);
    }else{
      weaknesses.push('未見明顯高階詞彙，可到「進階詞彙A／進階短語B」分類學習替換常用詞');
    }
    if(rep.length) weaknesses.push(`常用詞重複（${rep.slice(0,4).join('、')}），可嘗試用同義詞替換`);
    if(grammarIssues.length){
      grammarIssues.slice(0,5).forEach(g=>weaknesses.push(`文法／拼寫：${g.msg}（見到「${g.found}」）`));
    }else if(wordCount>100) strengths.push('未偵測到明顯文法／拼寫錯誤');
    tips.push('寫完後重讀一遍，檢查主謂一致、時態統一同標點符號');
    return {strengths:strengths.slice(0,6), weaknesses:weaknesses.slice(0,6), tips:tips.slice(0,5)};
  },
  /* ---------- LLM API 評分 ---------- */
  async analyzeAPI(text){
    const cfg=Store.state.essay;
    const base=cfg.provider==='openai'?'https://api.openai.com/v1/chat/completions':'https://api.deepseek.com/chat/completions';
    const sys=`You are an experienced HKDSE English Paper 2 examiner. Grade the essay according to the HKDSE marking scheme: Content (/10), Organisation (/10) and Language (/10). Respond ONLY with valid JSON in this exact format: {"content":number,"organisation":number,"language":number,"comment":"overall comment in Chinese","strengths":["..."],"improvements":["..."]}`;
    const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:'Essay to grade:\n'+text}],temperature:0.3,max_tokens:900,response_format:{type:'json_object'}})});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
    const j=await res.json();
    const raw=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
    const parsed=JSON.parse(raw.replace(/^```json\s*/,'').replace(/```$/,'').trim());
    const total=Math.round((Number(parsed.content)+Number(parsed.organisation)+Number(parsed.language))*10)/10;
    return {content:Number(parsed.content),organisation:Number(parsed.organisation),language:Number(parsed.language),total,level:EssayGrader.levelOf(total),mode:'api',comment:parsed.comment||'',strengths:parsed.strengths||[],improvements:parsed.improvements||[]};
  },
  /* ---------- 渲染 ---------- */
  enter(){ EssayGrader.render(); },
  render(){
    const v=Utils.$('#view-essay');
    const cfg=Store.state.essay;
    v.innerHTML=`
      <div class="essay-toolbar" style="margin-top:10px">
        <button class="btn sm ${!cfg.useApi?'soft':''}" onclick="EssayGrader.render()">✍️ 離線評分</button>
        <button class="btn sm ${cfg.useApi?'soft':''}" onclick="EssayGrader._useApi(true)">🤖 AI 深度評分</button>
        <button class="btn sm ghost" onclick="EssayGrader.renderSettings()">⚙️ 設置</button>
      </div>
      ${cfg.useApi?`<div class="chip brand" style="margin:2px 0 10px">🤖 AI 模式：${cfg.provider==='openai'?'OpenAI':'DeepSeek'}（${cfg.model}）</div>`:`<div class="chip" style="margin:2px 0 10px">✍️ 離線模式：唔使網絡，跟 HKEAA 標準分析</div>`}
      <div class="section-title" style="margin-top:4px"><span class="dot"></span>作文題目</div>
      <div class="card" style="margin-bottom:12px">
        <div class="cat-chips" style="padding-bottom:8px">${EssayGrader.prompts.map((p,i)=>`<button class="cat-chip ${EssayGrader.topic===p?'active':''}" onclick="EssayGrader.setTopic(${i})">題目 ${i+1}</button>`).join('')}</div>
        <textarea class="field" id="essayTopic" rows="2" placeholder="揀上面題目，或者自己輸入…" style="min-height:52px">${Utils.esc(EssayGrader.topic)}</textarea>
      </div>
      <div class="section-title"><span class="dot"></span>學生作文</div>
      <div class="card" style="margin-bottom:12px">
        <textarea class="field" id="essayText" rows="12" placeholder="貼上／輸入學生作文（建議 300-600 字）…">${Utils.esc(EssayGrader.text)}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--faint)"><span id="essayCount">0 字</span><span>DSE Paper 2 建議約 500 字</span></div>
      </div>
      <button class="btn" style="width:100%;margin-bottom:14px" onclick="EssayGrader.grade()">${cfg.useApi?'🤖 AI 深度評分':'📊 立即評分'}</button>
      ${EssayGrader.result?EssayGrader._resultHtml():''}
    `;
    const ta=Utils.$('#essayText');
    ta.addEventListener('input',()=>{ EssayGrader.text=ta.value; Utils.$('#essayCount').textContent=Utils.wordCount(ta.value)+' 字'; });
    const tp=Utils.$('#essayTopic');
    tp.addEventListener('input',()=>{ EssayGrader.topic=tp.value; });
  },
  setTopic(i){ EssayGrader.topic=EssayGrader.prompts[i]; EssayGrader.render(); },
  _useApi(on){ Store.state.essay.useApi=on; Store.persist(); EssayGrader.render(); },
  async grade(){
    const text=Utils.$('#essayText').value.trim();
    EssayGrader.text=text;
    if(Utils.wordCount(text)<30){ Utils.toast('作文太短，至少 30 字先評到分'); return; }
    const cfg=Store.state.essay;
    EssayGrader.loading=true;
    EssayGrader._renderLoading();
    try{
      if(cfg.useApi){
        if(!cfg.apiKey){ throw new Error('未設定 API Key，請到設置填入'); }
        EssayGrader.result=await EssayGrader.analyzeAPI(text);
      }else{
        await new Promise(r=>setTimeout(r,350));
        EssayGrader.result=EssayGrader.analyzeLocal(text);
      }
    }catch(e){
      Utils.toast('評分失敗：'+e.message);
      EssayGrader.result=null;
    }
    EssayGrader.loading=false;
    EssayGrader.render();
    if(EssayGrader.result){ const v=Utils.$('#view-essay'); v.scrollTop=v.scrollHeight; }
  },
  _renderLoading(){
    Utils.$('#view-essay').insertAdjacentHTML('beforeend',`<div class="grade-loading"><div class="spinner"></div><div>AI 分析緊作文…</div></div>`);
  },
  _resultHtml(){
    const r=EssayGrader.result;
    if(!r) return '';
    const totalRing=`<svg width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs><circle class="ring-bg" cx="48" cy="48" r="40"/><circle class="ring-fill" cx="48" cy="48" r="40" stroke-dasharray="${2*Math.PI*40}" stroke-dashoffset="${2*Math.PI*40*(1-r.total/30)}"/></svg><div class="ring-num">${r.total}</div><div class="ring-den">/ 30</div>`;
    const dim=(name,score,note)=>`<div class="dim-bar"><div class="dim-head"><span class="dim-name">${name}</span><span class="dim-score">${score} / 10</span></div><div class="dim-track"><div class="dim-fill" style="width:${score*10}%"></div></div>${note?`<div class="dim-note">${note}</div>`:''}</div>`;
    let detail='';
    if(r.mode==='local'){
      const m=r.stats;
      detail=`
        <div class="grade-section"><h4><span class="gs-ic">📏</span>文章數據</h4>
          <div class="highlight">字數 ${m.wordCount} · ${m.sentCount} 句 · ${m.paraCount} 段 · 平均句長 ${m.avgLen} 詞${m.connCount?` · 連接詞 ${m.connCount} 次（${m.connUniq} 種）`:''}</div>
        </div>`;
    }
    const strengths=r.feedback&&r.feedback.strengths||r.strengths||[];
    const weaknesses=r.feedback&&r.feedback.weaknesses||r.improvements||[];
    const tips=r.feedback&&r.feedback.tips||[];
    return `<div class="grade-result">
      <div class="score-hero">
        <div class="score-ring">${totalRing}</div>
        <div class="score-info">
          <div class="score-lv">${r.level.lv} <span class="lv-tag" style="background:${r.level.color};color:#fff">${r.level.tag}</span></div>
          <div class="score-meta">${r.mode==='api'?'🤖 AI 深度評分':'✍️ 離線規則評分'}<br>Content ${r.content} / Organisation ${r.organisation} / Language ${r.language}</div>
        </div>
      </div>
      <div class="score-bars">
        ${dim('內容 Content',r.content,r.mode==='local'?EssayGrader._contentNote(r.stats):'')}
        ${dim('組織 Organisation',r.organisation,r.mode==='local'?EssayGrader._orgNote(r.stats):'')}
        ${dim('語言 Language',r.language,r.mode==='local'?EssayGrader._langNote(r.stats):'')}
      </div>
      ${r.comment?`<div class="grade-section"><h4><span class="gs-ic">💬</span>總評</h4><div class="highlight">${Utils.esc(r.comment)}</div></div>`:''}
      ${detail}
      <div class="grade-section"><h4><span class="gs-ic">✅</span>做得好的地方</h4><ul>${strengths.map(s=>`<li class="good">${Utils.esc(s)}</li>`).join('')||'<li>文章完成度高</li>'}</ul></div>
      <div class="grade-section"><h4><span class="gs-ic">⚠️</span>需要改善</h4><ul>${weaknesses.map(s=>`<li class="bad">${Utils.esc(s)}</li>`).join('')||'<li>整體表現理想，繼續保持</li>'}</ul></div>
      ${tips.length?`<div class="grade-section"><h4><span class="gs-ic">💡</span>提升建議</h4><ul>${tips.map(s=>`<li>${Utils.esc(s)}</li>`).join('')}</ul></div>`:''}
      <button class="btn ghost" style="width:100%;margin-bottom:20px" onclick="EssayGrader.result=null;EssayGrader.render()">評下一份</button>
    </div>`;
  },
  _contentNote(m){
    const notes=[];
    if(m.wordCount<300) notes.push(`字數偏少（${m.wordCount} 字），內容分受影響`);
    else if(m.wordCount>=450) notes.push(`字數充足（${m.wordCount} 字）`);
    if(m.paraCount<3) notes.push(`段落偏少（${m.paraCount} 段）`);
    return notes.join('；');
  },
  _orgNote(m){
    const notes=[];
    if(m.connCount<3) notes.push(`連接詞少（${m.connCount} 次）`);
    else notes.push(`連接詞 ${m.connCount} 次（${m.connUniq} 種）`);
    return notes.join('；');
  },
  _langNote(m){
    const notes=[];
    notes.push(`高階詞 ${m.advRatio}%${m.advancedHits.length?`（${m.advancedHits.map(x=>x.phrase).join('、')}）`:''}`);
    if(m.grammarIssues.length) notes.push(`文法問題 ${m.grammarIssues.length} 處`);
    return notes.join('；');

/* =====================================================================
 * Level 測試（精簡版）
 * ===================================================================== */
const LvTest = {
  qs:[], idx:0, score:0, done:false,
  start(){
    const pool=Utils.shuffle(Data.raw).slice(0,10);
    LvTest.qs=pool.map(w=>{ const opts=Utils.shuffle(Data.raw.filter(x=>x.id!==w.id)).slice(0,3); return {w, opts:Utils.shuffle([w,...opts])}; });
    LvTest.idx=0; LvTest.score=0; LvTest.done=false;
    LvTest.render();
  },
  render(){
    const body=Utils.$('#lvtestBody');
    if(LvTest.done){
      const lv=LvTest.score>=10?'S級':LvTest.score>=8?'A級':LvTest.score>=6?'B級':LvTest.score>=4?'C級':'努力級';
      body.innerHTML=`<div class="empty"><div class="e-icon">${LvTest.score>=8?'🏆':'📚'}</div><div style="font-size:22px;font-weight:800;margin-bottom:4px">${LvTest.score} / 10</div><div class="chip brand" style="margin-bottom:16px">等級：${lv}</div><br><button class="btn" onclick="LvTest.start()">再測一次</button></div>`;
      return;
    }
    const q=LvTest.qs[LvTest.idx];
    body.innerHTML=`
      <div class="quiz-progress"><div class="quiz-fill" style="width:${LvTest.idx/LvTest.qs.length*100}%"></div></div>
      <div class="quiz-meta"><span>${LvTest.idx+1} / ${LvTest.qs.length}</span><span>答啱 ${LvTest.score}</span></div>
      <div class="quiz-card"><div class="quiz-q">${Utils.esc(q.w.meaning)}</div>
        <div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="LvTest.pick(${i})"><span class="qk">${'ABCD'[i]}</span><span>${Utils.esc(o.phrase)}</span></button>`).join('')}</div>
      </div>`;
  },
  pick(i){
    const q=LvTest.qs[LvTest.idx];
    if(q.opts[i].id===q.w.id) LvTest.score++;
    LvTest.idx++;
    if(LvTest.idx>=LvTest.qs.length){ LvTest.done=true; }
    LvTest.render();
  }
};
/* =====================================================================
 * App 主控

const App = {
  _cur:null,
  go(view){
    UI.go(view);
    const routers={ home:()=>Home.render(), flash:()=>Flash.enter(), quiz:()=>Quiz.enter(), browse:()=>Browse.enter(), writing:()=>WritingToolkit.enter(), essay:()=>EssayGrader.enter(), more:()=>More.render() };
    if(routers[view]) routers[view]();
  },
  openDetail(id){
    const w=Data.byId.get(id); if(!w) return;
    App._cur=w;
    const body=Utils.$('#sheetBody');
    body.innerHTML=`
      <div class="detail">
        <div class="d-cat">${Utils.esc(w.category)}</div>
        <div class="d-ph">${Utils.esc(w.phrase)}</div>
        <div class="d-stars">${'★'.repeat(Math.min(w.stars,5))}${w.stars>5?'（高階）':''}</div>
        <div class="d-mean">${Utils.esc(w.meaning)}</div>
        ${w.example?`<div class="d-ex">📝 ${Utils.esc(w.example)}</div>`:''}
        <div class="d-actions">
          <button class="btn sm ghost" onclick="App.toggleFav()">${Store.state.fav.has(Store.key(w))?'★ 已收藏':'☆ 收藏'}</button>
          <button class="btn sm ${Store.state.known.has(Store.key(w))?'ghost':'soft'}" onclick="App.toggleKnown()">${Store.state.known.has(Store.key(w))?'↩️ 取消掌握':'✅ 標記掌握'}</button>
        </div>
      </div>`;
    Utils.$('#overlay').classList.add('show');
  },
  closeSheet(){ Utils.$('#overlay').classList.remove('show'); },
  toggleFav(){
    const w=App._cur; if(!w) return;
    const k=Store.key(w);
    if(Store.state.fav.has(k)){ Store.state.fav.delete(k); Utils.toast('已取消收藏'); }
    else{ Store.state.fav.add(k); Utils.toast('已加入收藏 ⭐'); }
    Store.persist();
    if(UI.current==='browse') Browse.renderList();
    App.openDetail(w.id);
  },
  toggleKnown(){
    const w=App._cur; if(!w) return;
    const k=Store.key(w);
    if(Store.state.known.has(k)){ Store.state.known.delete(k); Utils.toast('已取消掌握'); }
    else{ Store.state.known.add(k); Store.state.wrong.delete(k); Utils.toast('已標記掌握 ✅'); }
    Store.persist();
    if(UI.current==='browse') Browse.renderList();
    App.openDetail(w.id);
  },
  toggleFavFromList(id){
    const w=Data.byId.get(id); if(!w) return;
    const k=Store.key(w);
    if(Store.state.fav.has(k)){ Store.state.fav.delete(k); Utils.toast('已取消收藏'); }
    else{ Store.state.fav.add(k); Utils.toast('已加入收藏 ⭐'); }
    Store.persist();
    if(UI.current==='browse') Browse.renderList();
  },
  setGoal(){
    const input=prompt('每日學習目標（詞數）：', Store.state.goal);
    const n=parseInt(input,10);
    if(n&&n>0&&n<=500){ Store.state.goal=n; Store.persist(); Store.notify(); Utils.toast('目標已更新為每日 '+n+' 詞 ✅'); }
    else if(input!==null) Utils.toast('請輸入 1-500 之間嘅數字');
  },
  setDseDate(){
    const input=prompt('DSE 英語科考試日期（YYYY-MM-DD，例如 2027-04-06）：', Store.state.dseDate||'2027-04-06');
    if(input===null) return;
    const m=input.trim().match(/^\d{4}-\d{2}-\d{2}$/);
    if(m){ Store.state.dseDate=input.trim(); Store.persist(); Store.notify(); Utils.toast('DSE 日期已更新 ✅'); }
    else if(input.trim()===''){ Store.state.dseDate=''; Store.persist(); Store.notify(); Utils.toast('已回復預設日期'); }
    else Utils.toast('格式錯誤：請用 YYYY-MM-DD');
  },
  toggleTheme(){
    Store.state.dark=!Store.state.dark;
    document.documentElement.setAttribute('data-theme', Store.state.dark?'dark':'');
    const btn=Utils.$('#themeBtn'); if(btn) btn.textContent=Store.state.dark?'☀️':'🌙';
    Store.persist();
  },
  exportData(){
    const s=Store.state;
    const blob=new Blob([JSON.stringify({app:'dse_vocab',v:3,t:Date.now(),known:[...s.known],wrong:[...s.wrong],fav:[...s.fav],sched:s.sched,history:s.history,goal:s.goal,mode:s.mode,quizCount:s.quizCount},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='dse_vocab_backup_'+Utils.today()+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    Utils.toast('已匯出備份檔案');
  },
  importData(input){
    const f=input.files&&input.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ try{ Store.importSnapshot(JSON.parse(reader.result)); Utils.toast('匯入成功 ✅'); App.go('home'); }catch(e){ Utils.toast('匯入失敗：檔案格式錯誤'); } };
    reader.readAsText(f); input.value='';
  },
  async exportWebDAV(){
    const url=prompt('WebDAV 檔案完整 URL（例如 https://dav.example.com/dse_vocab_backup.json）：');
    if(!url||!/^https?:\/\//i.test(url)) return;
    const token=prompt('可選：Authorization Token（冇就直接確定留空）','');
    const s=Store.state;
    const payload=JSON.stringify({app:'dse_vocab',v:3,t:Date.now(),known:[...s.known],wrong:[...s.wrong],fav:[...s.fav],sched:s.sched,history:s.history,goal:s.goal,mode:s.mode,quizCount:s.quizCount});
    try{
      const headers={'Content-Type':'application/json'};
      if(token&&token.trim()) headers['Authorization']=token.trim();
      const res=await fetch(url,{method:'PUT',headers,body:payload});
      if(!res.ok) throw new Error('HTTP '+res.status);
      Utils.toast('WebDAV 同步成功 ✅');
    }catch(e){ Utils.toast('WebDAV 同步失敗：'+e.message); }
  },
  resetData(){
    if(confirm('確定要重置所有學習數據？此操作無法還原。')){ Store.reset(); Utils.toast('已重置'); App.go('home'); }
  },
  closeGuide(){ Utils.$('#guide').classList.remove('show'); Store.state.onboarded=true; Storage.set('onboarded','1'); },
  async boot(){
    window.onerror=(msg)=>{ Utils.toast('⚠️ '+msg); };
    window.addEventListener('unhandledrejection',e=>{ Utils.toast('⚠️ '+(e.reason&&e.reason.message||'未知錯誤')); });
    Store.init();
    document.documentElement.setAttribute('data-theme', Store.state.dark?'dark':'');
    const btn=Utils.$('#themeBtn'); if(btn) btn.textContent=Store.state.dark?'☀️':'🌙';
    if(!Store.state.onboarded) Utils.$('#guide').classList.add('show');
    const n=await Data.load();
    if(!n){
      Utils.$('#view-home').innerHTML='<div class="empty"><div class="e-icon">😵</div>詞庫載入失敗<br>請確保 dse_vocab_data.js / dse_vocab_data.json 同 HTML 放埋一齊</div>';
      return;
    }
    Store.subscribe(()=>{
      if(UI.current==='home') Home.render();
      if(UI.current==='stats') Stats.render();
    });
    const fc=Utils.$('#flashWrap');
    let tx=0, ty=0;
    if(fc){
      fc.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
      fc.addEventListener('touchend',e=>{
        const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
        if(Math.abs(dx)>60&&Math.abs(dy)<80) Flash.swipe(dx>0?1:-1);
      },{passive:true});
    }
    Home.render();
    Utils.toast('詞庫載入完成 ✅');
    window.__booted=true;
  }
};
window.App=App; window.UI=UI; window.Utils=Utils; window.Data=Data;
window.Store=Store; window.SM2=SM2; window.Home=Home;
window.Flash=Flash; window.Quiz=Quiz; window.Browse=Browse;
window.Stats=Stats; window.WritingToolkit=WritingToolkit;
window.EssayGrader=EssayGrader; window.More=More; window.LvTest=LvTest;
App.boot();
</script>
